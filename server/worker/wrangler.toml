# Kinoko online relay: a Cloudflare Worker with two Durable Objects (one Room per room code, one Lobby for the public list).
# Deploy:  npm install && npx wrangler login && npx wrangler deploy      Local test:  npx wrangler dev   (http://localhost:8787)
name = "kinoko-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects (the kind available on the free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[vars]
# Comma-separated list of page origins allowed to use the relay, e.g. "https://dwainiumb.github.io". "*" allows any page.
ALLOWED_ORIGINS = "*"
