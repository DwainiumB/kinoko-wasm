name: Build

on: [push, pull_request]

# Read-only token: this runs the code of whoever opens a pull request.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install packages
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -y
          sudo apt-get install -y ninja-build gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10
          sudo update-alternatives --set gcc "/usr/bin/gcc-14"
          sudo update-alternatives --set g++ "/usr/bin/g++-14"
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Configure ninja
        run: ./configure.py
      - name: Compile
        run: ninja
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Kinoko
          path: |
            out
            samples
            tools
            STATUS.md
  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download llvm
        run: wget https://apt.llvm.org/llvm.sh
      - name: Install clang-format
        run: |
          chmod u+x llvm.sh
          sudo ./llvm.sh 16
          sudo apt install clang-format-16
      - name: Format Kinoko
        run: |
          dirs="include source"
          find $dirs -regex '.*\.\(c\|h\|cc\|hh\)' | xargs clang-format-16 --dry-run -Werror

# Upstream's `verify` (runs the test cases with a private runtime-data download, secret RUNTIME_DEPENDENCIES) and `website`
# (publishes the generated docs to GitHub Pages) jobs are not part of this repo: the first needs data that cannot be redistributed and the
# second would replace the web player on Pages. See pages.yml for the real deployment.
