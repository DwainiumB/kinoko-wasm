<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mario Kart Wii - Web Runner</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
    #overlay { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.75); padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
    select, button { background: #222; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .btn-blue { background: #0078d4; border-color: #0078d4; font-weight: bold; }
    .btn-blue:hover { background: #005a9e; }

    #controlsModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #444; z-index: 100; min-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    #controlsModal h3 { margin: 0 0 12px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .bind-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    .bind-btn { min-width: 90px; text-align: center; }
    .bind-btn.listening { background: #b80000; border-color: #ff3333; }

    /* Race HUD */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; font-family: "Arial Black", Impact, sans-serif; font-style: italic; color: #fff;
           text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
    #hudRight { position: absolute; top: calc(var(--ui, 1) * 130px); right: 18px; text-align: right; }
    /* time, lap counter and item box are drawn by hud.js (the game's own art); the text ones stay in the DOM but hidden */
    #hudLap, #hudTime { display: none; }
    #hudLap { font-size: 34px; line-height: 1; }
    #hudLap small { font-size: 20px; }
    #hudTime { font-size: 26px; margin-top: 6px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    #hudSplits { margin-top: 8px; font-size: 17px; line-height: 1.35; font-variant-numeric: tabular-nums; }
    #hudSplits .cur { color: #ffe14d; } #hudSplits .dim { opacity: .55; }
    #hudGhost { margin-top: 8px; font-size: 17px; line-height: 1.3; font-variant-numeric: tabular-nums; }
    #hudGhost .name { font-size: 13px; color: #9fd8ff; } .gapBehind { color: #ff8a80; } .gapAhead { color: #7dff9b; }
    #dropHint { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0, 90, 160, .55); color: #fff; font-size: 34px;
                align-items: center; justify-content: center; text-align: center; border: 6px dashed #9fd8ff; pointer-events: none; }
    #hudBest { margin-top: 6px; font-size: 14px; color: #9fe8ff; font-variant-numeric: tabular-nums; }
    #hudBanner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 84px; opacity: 0; }
    #hudBanner.show { animation: hudPop 1.1s ease-out forwards; }
    @keyframes hudPop { 0% { opacity: 0; transform: scale(2.2); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
    #hudWrong { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 56px; color: #ff3b30; display: none; animation: hudBlink .7s steps(2, jump-none) infinite; }
    @keyframes hudBlink { 50% { opacity: .15; } }
    #hudFinish { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); text-align: center; display: none; background: rgba(0,0,0,.55); padding: 18px 40px; border-radius: 10px; }
    #hudFinish h1 { margin: 0 0 8px; font-size: 46px; color: #ffe14d; }
    #hudFinish div { font-size: 24px; line-height: 1.5; font-variant-numeric: tabular-nums; }

    /* Ghost name tags: floats above each loaded ghost, like the real game's in-race nameplate */
    .ghostNameTag { position: fixed; top: 0; left: 0; z-index: 15; pointer-events: none;
                    background: rgba(0,0,0,.72); color: #fff; font: bold 15px/1 "Arial Black", Impact, sans-serif;
                    padding: 5px 10px; border-radius: 5px; white-space: nowrap;
                    text-shadow: 1px 1px 0 #000; transition: opacity .15s; }
    body.nameTagsDim .ghostNameTag { opacity: .35; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="nw4r_ef.js?v=6"></script>
  <script src="kartfx.js?v=16"></script>
  <script src="online.js?v=1"></script>
  <script src="hud.js?v=3"></script>
  <script src="cpu.js?v=4"></script>
  <script src="kinoko_web.js?v=16"></script>
  <script src="assetgate.js?v=1"></script>   <!-- starts #mainApp once the game assets are reachable (see assetgate.js) -->
</head>
<body>
  <div id="overlay">
    <div><strong>Status:</strong> <span id="status">Loading WASM and Assets...</span></div>
    <div style="margin-top: 8px;">
      <label><strong>Track:</strong> </label><select id="trackSelect"></select>
      <label style="margin-left: 8px;"><strong>Character:</strong> </label><select id="charSelect"></select>
      <label style="margin-left: 8px;"><strong>Vehicle:</strong> </label><select id="vehSelect"></select>
      <button id="restartBtn" class="btn-blue" style="margin-left: 10px;">Restart</button>
      <button id="openControlsBtn" style="margin-left: 6px;">Controls</button>
      <button id="perfBtn" style="margin-left: 6px;" title="Performance overlay (F3)">Perf</button>
      <button id="bloomBtn" style="margin-left: 6px;" title="The game's bloom post-effect (F5)">Bloom: on</button>
      <button id="dofBtn" style="margin-left: 6px;" title="The game's depth-of-field post-effect (F6)">DOF: on</button>
      <button id="capBtn" style="margin-left: 6px;" title="Draw at the game's 59.94 frames per second instead of the screen's refresh rate (F4)">FPS: display</button>
      <button id="markersBtn" style="margin-left: 6px;" title="Tall always-visible beams (orange = Ghost 1, magenta = Ghost 2) at each loaded ghost's exact position, each with an XYZ axis gizmo -- makes who's actually ahead, and which way is which, unambiguous regardless of camera angle or occlusion">Markers: off</button>
      <span id="markersLegend" style="display:none; margin-left: 6px; font-size: 0.85em;">
        <span style="color:#ffa500;">&#9632;</span> Ghost 1
        <span style="color:#ff00ff; margin-left:4px;">&#9632;</span> Ghost 2
        &nbsp;|&nbsp; Axes:
        <span style="color:#ff4040;">&#9632;</span> X
        <span style="color:#40ff40;">&#9632;</span> Y (up)
        <span style="color:#4080ff;">&#9632;</span> Z
      </span>
      <button id="nameTagsBtn" style="margin-left: 6px;" title="Floating name tag above each loaded ghost, like the game's in-race nameplate -- click to toggle between fully opaque and a dimmer, more translucent look">Tags: on</button>
      <label style="margin-left: 8px;"><strong>Camera:</strong> </label><select id="camSelect"></select>
      <label style="margin-left: 8px;"><strong>Mode:</strong> </label><select id="modeSelect"><option value="0">Time Trial</option><option value="1">VS</option></select>
      <select id="cpuSelect" title="CPU racers"></select>
      <label style="margin-left: 8px;"><strong>Ghost:</strong> </label><select id="ghostSelect" style="max-width: 260px;"><option value="">No ghost</option></select>
      <label style="margin-left: 4px;"><strong>vs.</strong> </label><select id="ghost2Select" style="max-width: 260px;"><option value="">No 2nd ghost</option></select>
      <span id="ghostGapLabel" style="margin-left: 6px; display: none; font-family: monospace;"></span>
      <button id="ghostPauseBtn" style="margin-left: 8px; display: none;" title="Pause/resume so the ghost can be stepped frame by frame">Pause</button>
      <button id="ghostPrevBtn" style="margin-left: 2px; display: none;" title="Step the ghost back one physics frame">&#9664;</button>
      <button id="ghostNextBtn" style="margin-left: 2px; display: none;" title="Step the ghost forward one physics frame">&#9654;</button>
      <span id="ghostFrameLabel" style="margin-left: 6px; display: none;"></span>
      <canvas id="ghostStickCanvas" width="44" height="44" style="margin-left: 8px; vertical-align: middle; display: none; background: #222; border-radius: 4px;"></canvas>
      <span id="ghostButtonsLabel" style="margin-left: 4px; display: none; font-family: monospace;"></span>
    </div>
    <div id="pos" style="margin-top: 6px;">Pos: [0, 0, 0]</div>
  </div>

  <div id="hud">
    <div id="hudRight">
      <div id="hudLap"></div>
      <div id="hudTime"></div>
      <div id="hudSplits"></div>
      <div id="hudBest"></div>
      <div id="hudGhost"></div>
    </div>

    <div id="hudBanner"></div>
    <div id="hudWrong">WRONG WAY</div>
    <div id="hudFinish"></div>
  </div>

  <div id="dropHint">Drop a .rkg ghost file to race against it</div>

  <!-- Rebind Modal -->
  <div id="controlsModal">
    <h3>Custom Keybinds</h3>
    <div id="bindsContainer"></div>
    <div style="margin-top: 15px; text-align: right;">
      <button id="resetBindsBtn" style="float: left;">Reset Defaults</button>
      <button id="closeControlsBtn" class="btn-blue">Done</button>
    </div>
  </div>

  <script type="text/plain" id="mainApp">
    const statusEl = document.getElementById('status');
    const posEl = document.getElementById('pos');
    const trackSelect = document.getElementById('trackSelect');
    const charSelect = document.getElementById('charSelect');
    const vehSelect = document.getElementById('vehSelect');

    // IDs and folders match Kinoko's Course enum and COURSE_NAMES (include/Common.hh), in cup order.
    const TRACKS = [
      { id: 8,  folder: "beginner_course",     name: "Luigi Circuit" },
      { id: 1,  folder: "farm_course",         name: "Moo Moo Meadows" },
      { id: 2,  folder: "kinoko_course",       name: "Mushroom Gorge" },
      { id: 4,  folder: "factory_course",      name: "Toad's Factory" },
      { id: 0,  folder: "castle_course",       name: "Mario Circuit" },
      { id: 5,  folder: "shopping_course",     name: "Coconut Mall" },
      { id: 6,  folder: "boardcross_course",   name: "DK Summit" },
      { id: 7,  folder: "truck_course",        name: "Wario's Gold Mine" },
      { id: 9,  folder: "senior_course",       name: "Daisy Circuit" },
      { id: 15, folder: "water_course",        name: "Koopa Cape" },
      { id: 11, folder: "treehouse_course",    name: "Maple Treeway" },
      { id: 3,  folder: "volcano_course",      name: "Grumble Volcano" },
      { id: 14, folder: "desert_course",       name: "Dry Dry Ruins" },
      { id: 10, folder: "ridgehighway_course", name: "Moonview Highway" },
      { id: 12, folder: "koopa_course",        name: "Bowser's Castle" },
      { id: 13, folder: "rainbow_course",      name: "Rainbow Road" },
      { id: 16, folder: "old_peach_gc",        name: "GCN Peach Beach" },
      { id: 20, folder: "old_falls_ds",        name: "DS Yoshi Falls" },
      { id: 25, folder: "old_obake_sfc",       name: "SNES Ghost Valley 2" },
      { id: 26, folder: "old_mario_64",        name: "N64 Mario Raceway" },
      { id: 27, folder: "old_sherbet_64",      name: "N64 Sherbet Land" },
      { id: 31, folder: "old_heyho_gba",       name: "GBA Shy Guy Beach" },
      { id: 23, folder: "old_town_ds",         name: "DS Delfino Square" },
      { id: 18, folder: "old_waluigi_gc",      name: "GCN Waluigi Stadium" },
      { id: 21, folder: "old_desert_ds",       name: "DS Desert Hills" },
      { id: 30, folder: "old_koopa_gba",       name: "GBA Bowser Castle 3" },
      { id: 29, folder: "old_donkey_64",       name: "N64 DK's Jungle Parkway" },
      { id: 17, folder: "old_mario_gc",        name: "GCN Mario Circuit" },
      { id: 24, folder: "old_mario_sfc",       name: "SNES Mario Circuit 3" },
      { id: 22, folder: "old_garden_ds",       name: "DS Peach Gardens" },
      { id: 19, folder: "old_donkey_gc",       name: "GCN DK Mountain" },
      { id: 28, folder: "old_koopa_64",        name: "N64 Bowser's Castle" }
    ];

    const CHARACTERS = [
      { id: 0, folder: "mario", name: "Mario" }, { id: 1, folder: "baby_peach", name: "Baby Peach" },
      { id: 2, folder: "waluigi", name: "Waluigi" }, { id: 3, folder: "bowser", name: "Bowser" },
      { id: 4, folder: "baby_daisy", name: "Baby Daisy" }, { id: 5, folder: "dry_bones", name: "Dry Bones" },
      { id: 6, folder: "baby_mario", name: "Baby Mario" }, { id: 7, folder: "luigi", name: "Luigi" },
      { id: 8, folder: "toad", name: "Toad" }, { id: 9, folder: "donkey_kong", name: "Donkey Kong" },
      { id: 10, folder: "yoshi", name: "Yoshi" }, { id: 11, folder: "wario", name: "Wario" },
      { id: 12, folder: "baby_luigi", name: "Baby Luigi" }, { id: 13, folder: "toadette", name: "Toadette" },
      { id: 14, folder: "koopa_troopa", name: "Koopa Troopa" }, { id: 15, folder: "daisy", name: "Daisy" },
      { id: 16, folder: "peach", name: "Peach" }, { id: 17, folder: "birdo", name: "Birdo" },
      { id: 18, folder: "diddy_kong", name: "Diddy Kong" }, { id: 19, folder: "king_boo", name: "King Boo" },
      { id: 20, folder: "bowser_jr", name: "Bowser Jr." }, { id: 21, folder: "dry_bowser", name: "Dry Bowser" },
      { id: 22, folder: "funky_kong", name: "Funky Kong" }, { id: 23, folder: "rosalina", name: "Rosalina" }
    ];

    const VEHICLES = [
      { id: 0, folder: "standard_kart_s", name: "Standard Kart S" },
      { id: 1, folder: "standard_kart_m", name: "Standard Kart M" },
      { id: 2, folder: "standard_kart_l", name: "Standard Kart L" },
      { id: 3, folder: "baby_booster", name: "Baby Booster" },
      { id: 4, folder: "classic_dragster", name: "Classic Dragster" },
      { id: 5, folder: "offroader", name: "Offroader" },
      { id: 6, folder: "mini_beast", name: "Mini Beast" },
      { id: 7, folder: "wild_wing", name: "Wild Wing" },
      { id: 8, folder: "flame_flyer", name: "Flame Flyer" },
      { id: 9, folder: "cheep_charger", name: "Cheep Charger" },
      { id: 10, folder: "super_blooper", name: "Super Blooper" },
      { id: 11, folder: "prowler", name: "Prowler" },
      { id: 12, folder: "tiny_titan", name: "Tiny Titan" },
      { id: 13, folder: "daytripper", name: "Daytripper" },
      { id: 14, folder: "jetsetter", name: "Jetsetter" },
      { id: 15, folder: "blue_falcon", name: "Blue Falcon" },
      { id: 16, folder: "sprinter", name: "Sprinter" },
      { id: 17, folder: "honeycoupe", name: "Honeycoupe" },
      { id: 18, folder: "standard_bike_s", name: "Standard Bike S" },
      { id: 19, folder: "standard_bike_m", name: "Standard Bike M" },
      { id: 20, folder: "standard_bike_l", name: "Standard Bike L" },
      { id: 21, folder: "bullet_bike", name: "Bullet Bike" },
      { id: 22, folder: "mach_bike", name: "Mach Bike" },
      { id: 23, folder: "flame_runner", name: "Flame Runner" },
      { id: 24, folder: "bit_bike", name: "Bit Bike" },
      { id: 25, folder: "sugarscoot", name: "Sugarscoot" },
      { id: 26, folder: "wario_bike", name: "Wario Bike" },
      { id: 27, folder: "quacker", name: "Quacker" },
      { id: 28, folder: "zip_zip", name: "Zip Zip" },
      { id: 29, folder: "shooting_star", name: "Shooting Star" },
      { id: 30, folder: "magikruiser", name: "Magikruiser" },
      { id: 31, folder: "sneakster", name: "Sneakster" },
      { id: 32, folder: "spear", name: "Spear" },
      { id: 33, folder: "jet_bubble", name: "Jet Bubble" },
      { id: 34, folder: "dolphin_dasher", name: "Dolphin Dasher" },
      { id: 35, folder: "phantom", name: "Phantom" }
    ];

    // Model archive codes (Race/Kart/<vehicle>-<character>.szs), indexed by Kinoko's Character
    // and Vehicle enums. As in the game, a character can only drive vehicles of its weight class
    // (0 small, 1 medium, 2 large); a vehicle's class is its ID % 3.
    const CHARACTER_FILES = ['mr', 'bpc', 'wl', 'kp', 'bds', 'ka', 'bmr', 'lg', 'ko', 'dk', 'ys', 'wr',
                             'blg', 'kk', 'nk', 'ds', 'pc', 'ca', 'dd', 'kt', 'jr', 'bk', 'fk', 'rs'];
    const CHARACTER_CLASS = [1, 0, 2, 2, 0, 0, 0, 1, 0, 2, 1, 2, 0, 0, 0, 1, 1, 1, 1, 2, 1, 2, 2, 2];
    const VEHICLE_FILES = ['kart', 'bike'].flatMap(t => ['sdf', 'mdf', 'ldf', 'sa', 'ma', 'la', 'sb', 'mb', 'lb',
                                                          'sc', 'mc', 'lc', 'sd', 'md', 'ld', 'se', 'me', 'le']
                                                          .map(p => `${p}_${t}`));

    const savedTrack = localStorage.getItem('mkw_track') || "0x08";
    const savedChar = localStorage.getItem('mkw_char') || "0";
    const savedVeh = localStorage.getItem('mkw_veh') || "1";

    TRACKS.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id; opt.text = t.name;
      if (t.id === parseInt(savedTrack)) opt.selected = true;
      trackSelect.appendChild(opt);
    });

    CHARACTERS.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.text = c.name;
      if (c.id === parseInt(savedChar)) opt.selected = true;
      charSelect.appendChild(opt);
    });

    function fillVehicles(preferredId) {
      const weightClass = CHARACTER_CLASS[parseInt(charSelect.value)];
      const allowed = VEHICLES.filter(v => v.id % 3 === weightClass);
      const keep = allowed.find(v => v.id === preferredId) || allowed[0];
      vehSelect.innerHTML = '';
      allowed.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id; opt.text = v.name;
        opt.selected = v === keep;
        vehSelect.appendChild(opt);
      });
    }
    fillVehicles(parseInt(savedVeh));
    // Switching character keeps the same vehicle "slot" (e.g. Standard Kart M -> L) when possible
    charSelect.onchange = () => {
      const id = parseInt(vehSelect.value);
      fillVehicles(id - (id % 3) + CHARACTER_CLASS[parseInt(charSelect.value)]);
    };

    // Mode: Time Trial or VS with n CPU racers
    {
      const modeSelect = document.getElementById('modeSelect'), cpuSelect = document.getElementById('cpuSelect');
      for (let i = 1; i <= 11; i++) cpuSelect.add(new Option(`${i} CPU${i > 1 ? 's' : ''}`, i));
      try { modeSelect.value = localStorage.getItem('mkw_mode') === '1' ? '1' : '0'; cpuSelect.value = localStorage.getItem('mkw_cpus') || '3'; } catch (e) {}
      const sync = () => { cpuSelect.style.display = modeSelect.value === '1' ? '' : 'none'; };
      modeSelect.onchange = sync; sync();
    }

    document.getElementById('restartBtn').onclick = () => {
      try { localStorage.setItem('mkw_mode', document.getElementById('modeSelect').value); localStorage.setItem('mkw_cpus', document.getElementById('cpuSelect').value); } catch (e) {}
      try { net.leaveRace(); } catch (e) {}
      localStorage.setItem('mkw_track', trackSelect.value);
      localStorage.setItem('mkw_char', charSelect.value);
      localStorage.setItem('mkw_veh', vehSelect.value);
      try {
        const gc = localStorage.getItem('mkw_ghost_course');
        if (localStorage.getItem('mkw_ghost') && gc !== null && parseInt(gc) !== parseInt(trackSelect.value)) {
          localStorage.removeItem('mkw_ghost'); localStorage.removeItem('mkw_ghost_course');
        }
      } catch (e) {}
      location.reload();
    };

    // --- Controls System ---
    const DEFAULT_BINDS = {
      "Accelerate (A)": "KeyZ",
      "Brake / Reverse (B)": "KeyX",
      "Drift / Hop (R)": "KeyW",
      "Use Item (L)": "KeyS",
      "Steer Left": "ArrowLeft",
      "Steer Right": "ArrowRight",
      "Stick Up": "ArrowUp",
      "Stick Down": "ArrowDown",
      "Wheelie / Trick Up": "KeyC",
      "Trick Left": "KeyQ",
      "Trick Right": "KeyE",
      "Trick Down": "KeyV",
      "Look Back": "ShiftLeft"
    };

    // Merge over the defaults (not replace) so a key added here later still shows up for players with saved binds.
    let userBinds = Object.assign({}, DEFAULT_BINDS, JSON.parse(localStorage.getItem('mkw_binds')) || {});
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup',   e => { keys[e.code] = false; });

    const modal = document.getElementById('controlsModal');
    const bindsContainer = document.getElementById('bindsContainer');
    let listeningAction = null;

    function renderBindsUI() {
      bindsContainer.innerHTML = '';
      for (const [action, currentKey] of Object.entries(userBinds)) {
        const row = document.createElement('div');
        row.className = 'bind-row';
        row.innerHTML = `<span>${action}</span>`;

        const btn = document.createElement('button');
        btn.className = 'bind-btn';
        btn.innerText = currentKey.replace('Key', '').replace('Arrow', '');
        btn.onclick = () => {
          if (listeningAction) return;
          listeningAction = action;
          btn.innerText = 'Press Key...';
          btn.classList.add('listening');

          const listener = (e) => {
            e.preventDefault();
            userBinds[action] = e.code;
            localStorage.setItem('mkw_binds', JSON.stringify(userBinds));
            window.removeEventListener('keydown', listener);
            listeningAction = null;
            renderBindsUI();
          };
          window.addEventListener('keydown', listener, { once: true });
        };

        row.appendChild(btn);
        bindsContainer.appendChild(row);
      }
    }

    document.getElementById('openControlsBtn').onclick = () => { renderBindsUI(); modal.style.display = 'block'; };
    document.getElementById('closeControlsBtn').onclick = () => { modal.style.display = 'none'; };
    document.getElementById('resetBindsBtn').onclick = () => {
      userBinds = Object.assign({}, DEFAULT_BINDS);
      localStorage.setItem('mkw_binds', JSON.stringify(userBinds));
      renderBindsUI();
    };

    function isDown(action) {
      const code = userBinds[action];
      return code ? !!keys[code] : false;
    }

    const driftButton = { on: false, blocked: false, prevA: false, prevB: false };
    function pollInputs() {
      let buttons = 0, stickX = 0, stickY = 0, trick = 0;

      if (isDown("Accelerate (A)"))     buttons |= 0x1;
      // On a GameCube controller B and R are the same button: with A held it is the drift / hop button (R), without
      // A it is the brake (B). The physics decides whether a hop is possible (it needs speed).
      let brakeOrDrift = isDown("Brake / Reverse (B)") || isDown("Drift / Hop (R)");
      if (isDown("Use Item (L)"))       buttons |= 0x4;

      if (isDown("Steer Left"))  stickX -= 1.0;
      if (isDown("Steer Right")) stickX += 1.0;
      if (isDown("Stick Up"))    stickY += 1.0;
      if (isDown("Stick Down"))  stickY -= 1.0;

      if (isDown("Wheelie / Trick Up")) trick = 1;
      if (isDown("Trick Down"))         trick = 2;
      if (isDown("Trick Left"))         trick = 3;
      if (isDown("Trick Right"))        trick = 4;

      const gp = navigator.getGamepads ? (navigator.getGamepads()[0] || navigator.getGamepads()[1]) : null;
      if (gp) {
        if (gp.buttons[0]?.pressed) buttons |= 0x1;
        if (gp.buttons[4]?.pressed || gp.buttons[6]?.pressed) buttons |= 0x4;
        if (gp.buttons[1]?.pressed || gp.buttons[2]?.pressed || gp.buttons[5]?.pressed || gp.buttons[7]?.pressed) brakeOrDrift = true;

        const deadzone = 0.15;
        const ax = gp.axes[0] || 0;
        const ay = -(gp.axes[1] || 0);
        if (Math.abs(ax) > deadzone) stickX = ax;
        if (Math.abs(ay) > deadzone) stickY = ay;

        if (gp.buttons[12]?.pressed) trick = 1;
        if (gp.buttons[13]?.pressed) trick = 2;
        if (gp.buttons[14]?.pressed) trick = 3;
        if (gp.buttons[15]?.pressed) trick = 4;
      }

      stickX = Math.max(-1.0, Math.min(1.0, stickX));
      stickY = Math.max(-1.0, Math.min(1.0, stickY));

      // The game's internal "drift button" (wiki.mkwtas.com/wiki/Drift_button): B/R are the brake/reverse buttons;
      // the drift button is set when A and B/R are both held and B/R was not pressed before A. It stays set while
      // both are held; B pressed first then A only keeps braking. B/R and the drift bit are sent together (A+B+drift).
      const a = (buttons & 0x1) !== 0, b = brakeOrDrift;
      if (!(a && b)) { driftButton.on = false; driftButton.blocked = false; }
      else if (!driftButton.on && !driftButton.blocked) {
        if (driftButton.prevB && !driftButton.prevA) driftButton.blocked = true; else driftButton.on = true;
      }
      driftButton.prevA = a; driftButton.prevB = b;
      if (b) buttons |= 0x2;
      if (driftButton.on) buttons |= 0x8;
      return { buttons, stickX, stickY, trick };
    }

    // --- MKWii Sound Engine (real game samples, driven by Kinoko's kart state) ---
    // Samples come from tools/export_web_sounds.py (your own revo_kart.brsar). Continuous sounds
    // (engine, drift smoke, sparks, offroad) are loops whose gain/pitch follow the physics;
    // one-shots and character voices fire on state changes detected every physics step.

    // Must match KartSoundFlag in source/host/web_bridge.cc
    const SND = {
      ACCELERATE: 1 << 0, BRAKE: 1 << 1, GROUND: 1 << 2, HOP: 1 << 3, DRIFT: 1 << 4,
      BOOST: 1 << 5, MUSHROOM: 1 << 6, WHEELIE: 1 << 7, TRICK: 1 << 8, LONG_AIR: 1 << 9,
      WALL: 1 << 10, JUMP_PAD: 1 << 11, ZIPPER: 1 << 12, CANNON: 1 << 13, RESPAWN: 1 << 14,
      BURNOUT: 1 << 15, HIT: 1 << 16, OFFROAD: 1 << 17,
    };

    // Engine pitch = vehicle pitch * lerp(ENGINE_MIN_RATE, vehicle maxPitch * ENGINE_TOP_SCALE, speedRatio).
    // The game's exact curve lives in its sound sequences; these are tuned by ear.
    const ENGINE_MIN_RATE = 0.8;
    const ENGINE_TOP_SCALE = 0.75;
    const VOICE_COOLDOWN_S = 1.2;

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.manifest = null;
        this.buffers = new Map();   // file name -> AudioBuffer
        this.loops = {};            // name -> { src, gain }
        this.engine = null;         // vehicle engine entry from the manifest
        this.voices = {};           // event -> [sound ids] for the selected character
        this.prevFlags = 0;
        this.prevDrift = 0;
        this.motion = { speed: 0, speedRatio: 0, driftState: 0 };
        this.flags = 0;
        this.voiceSrc = null;
        this.lastVoiceTime = -Infinity;
        this.lastWallTime = -Infinity;
        this.hadLongAir = false;
      }

      // Called once at startup. The AudioContext starts suspended until the first key/click.
      async load(characterName, vehicleId) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.8;
        this.master.connect(this.ctx.destination);

        const res = await fetch('assets/sound/sounds.json');
        if (!res.ok) throw new Error('Missing assets/sound/sounds.json - run tools/export_web_sounds.py');
        this.manifest = await res.json();

        this.engine = this.manifest.engines[vehicleId];
        this.voices = this.manifest.voices[characterName] || {};

        const ids = new Set([
          ...Object.values(this.manifest.sfx),
          ...Object.values(this.engine.ids),
          ...Object.values(this.voices).flat(),
        ]);
        const files = [...ids].flatMap(id => this.manifest.sounds[id]?.files || []);
        await Promise.all(files.map(async f => {
          const r = await fetch('assets/sound/' + f.file);
          if (!r.ok) return;
          this.buffers.set(f.file, await this.ctx.decodeAudioData(await r.arrayBuffer()));
        }));

        this.loops.idle = this.makeLoop(this.engine.ids.IDLE);
        this.loops.engine = this.makeLoop(this.engine.ids.LOOP);
        this.loops.smoke = this.makeLoop(this.manifest.sfx.drift_smoke);
        this.loops.sparkBlue = this.makeLoop(this.manifest.sfx.spark_blue);
        this.loops.sparkOrange = this.makeLoop(this.manifest.sfx.spark_orange);
        this.loops.offroad = this.makeLoop(this.manifest.sfx.offroad);
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      file(id) {
        const files = this.manifest.sounds[id]?.files || [];
        return files.length ? files[Math.floor(Math.random() * files.length)] : null;
      }

      makeLoop(id) {
        const f = this.file(id);
        const buf = f && this.buffers.get(f.file);
        if (!buf) return null;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        if (f.loopEnd) {
          src.loopStart = f.loopStart;
          src.loopEnd = f.loopEnd;
        }
        const gain = this.ctx.createGain();
        gain.gain.value = 0;
        src.connect(gain).connect(this.master);
        src.start();
        return { src, gain };
      }

      setLoop(name, volume, rate) {
        const l = this.loops[name];
        if (!l) return;
        const t = this.ctx.currentTime;
        l.gain.gain.setTargetAtTime(volume, t, 0.04);
        if (rate !== undefined) l.src.playbackRate.setTargetAtTime(rate, t, 0.05);
      }

      play(id, volume = 1, rate = 1) {
        const f = this.file(id);
        const buf = f && this.buffers.get(f.file);
        if (!buf) return null;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = rate;
        const gain = this.ctx.createGain();
        gain.gain.value = volume;
        src.connect(gain).connect(this.master);
        src.start();
        return src;
      }

      sfx(name, volume = 1) {
        return this.play(this.manifest.sfx[name], volume);
      }

      voice(event, chance = 1) {
        const ids = this.voices[event];
        const now = this.ctx.currentTime;
        if (!ids || !ids.length || Math.random() > chance) return;
        if (now - this.lastVoiceTime < VOICE_COOLDOWN_S) return;
        if (this.voiceSrc) { try { this.voiceSrc.stop(); } catch (e) {} }
        this.voiceSrc = this.play(ids[Math.floor(Math.random() * ids.length)], 0.9);
        this.lastVoiceTime = now;
      }

      // Called after every physics step with the kart's state; fires one-shot sounds on changes.
      step(flags, speed, speedRatio, driftState) {
        const impactSpeed = Math.max(speed, this.motion.speed); // wall hits zero the speed this step
        this.flags = flags;
        this.motion = { speed, speedRatio, driftState };
        if (!this.manifest) return;

        const rose = bit => (flags & bit) && !(this.prevFlags & bit);
        const ids = this.engine.ids;

        if (rose(SND.ACCELERATE) && speed < 5) this.play(ids.FUKASHI, 0.6, this.engine.pitch);
        if (rose(SND.HOP)) this.sfx('hop', 0.7);
        if (rose(SND.BOOST) || rose(SND.MUSHROOM)) this.sfx('boost', 0.8);
        if (rose(SND.MUSHROOM)) this.voice('boost');
        if (rose(SND.ZIPPER)) this.voice('boost', 0.5);
        if (rose(SND.TRICK)) { this.sfx('trick', 0.8); this.voice('trick'); }
        if (rose(SND.WHEELIE)) this.voice('wheelie', 0.4);
        if (rose(SND.JUMP_PAD)) { this.sfx('jump_pad', 0.8); this.voice('jump_big'); }
        if (rose(SND.HIT)) { this.sfx('spin', 0.8); this.voice('hit'); }
        if (rose(SND.BURNOUT)) { this.sfx('start_fail', 0.8); this.voice('start_fail'); }

        if (flags & SND.LONG_AIR) this.hadLongAir = true;
        if (rose(SND.GROUND) && this.hadLongAir) {
          this.hadLongAir = false;
          this.voice('land', 0.5);
        }

        const now = this.ctx.currentTime;
        if (rose(SND.WALL) && impactSpeed > 20 && now - this.lastWallTime > 0.3) {
          this.sfx('wall', Math.min(1, impactSpeed / 80));
          this.lastWallTime = now;
        }

        this.prevFlags = flags;
        this.prevDrift = driftState;
      }

      // Called once per rendered frame; eases the looping sounds toward the current state.
      render() {
        if (!this.manifest) return;
        const { speed, speedRatio, driftState } = this.motion;
        const flags = this.flags;
        const sr = Math.max(0, Math.min(speedRatio, 1.2));
        const grounded = !!(flags & SND.GROUND);
        const driving = sr > 0.05 || (flags & SND.ACCELERATE);

        // Engine: idle rumble at a standstill, crossfading into the pitched drive loop.
        const e = this.engine;
        const rate = e.pitch * (ENGINE_MIN_RATE + (e.maxPitch * ENGINE_TOP_SCALE - ENGINE_MIN_RATE) * sr);
        this.setLoop('idle', driving ? 0.1 * (1 - sr) : 0.35, e.pitch);
        this.setLoop('engine', driving ? 0.25 + 0.2 * sr : 0, rate);

        const drifting = !!(flags & SND.DRIFT) && grounded && speed > 10;
        this.setLoop('smoke', drifting ? 0.35 : 0);
        // driftState: 2 = blue mini-turbo charged, 3 = orange super mini-turbo charged
        this.setLoop('sparkBlue', drifting && driftState === 2 ? 0.4 : 0);
        this.setLoop('sparkOrange', drifting && driftState === 3 ? 0.4 : 0);

        this.setLoop('offroad', (flags & SND.OFFROAD) && grounded && speed > 5 ? 0.4 : 0);
      }
    }

    const sound = new SoundEngine();

    // --- Driver animation ---
    // Plays the character's own MKWii animations (driver.glb) from the physics state. The base
    // clips (drive, drift_l/r, wheelie, back, dash) are steering blends: the first and last frames
    // are full lock right/left and the middle frame is straight ahead, so they're scrubbed by the
    // steering input instead of played. Tricks, damage and the finish pose play over them. After
    // the animation, hands and feet are pulled onto the wheel/handlebars and pedals/footpegs with
    // two-bone IK, using targets from kartDriverDispParam (stored in driver.glb's extras).
    const STEER_SMOOTHING = 0.2;   // fraction per physics frame the pose follows the stick
    const CLIP_FADE_S = 0.12;
    const IK_PASSES = 4;
    const MAX_WHEEL_STEER = THREE.MathUtils.degToRad(20);  // handle_drive turns the bars +-20 deg
    const KART_TRICKS = ['sjump_a', 'sjump_b', 'sjump_c'];
    // Bikes have three trick tiers (small/medium/large) matching the real game's escalating trick
    // size with hang time; SND.LONG_AIR (AirtimeOver20) is the only airtime signal Kinoko exposes,
    // so short air picks from the small tier and long air from medium+large (an approximation of the
    // real game's exact tiering, which likely also considers ramp/gap size, not just frame count).
    const BIKE_TRICKS_SHORT = ['sjump_sa', 'sjump_sb', 'sjump_sc'];
    const BIKE_TRICKS_LONG = ['sjump_ma', 'sjump_mb', 'sjump_mc', 'sjump_la', 'sjump_lb', 'sjump_lc'];

    class DriverAnimator {
      constructor(root, clips, extras, isBike) {
        this.root = root;
        this.isBike = isBike;
        this.ik = (extras || {}).ik || null;
        // Bike animations are authored per bike and already hold the bars; the game data's grip
        // targets sit lower (inside the Mach Bike's cowl, vs in-game screenshots), so bikes keep
        // the animation's hands and only use IK for the feet on the pegs.
        if (this.ik && isBike) this.ik = Object.assign({}, this.ik, { hand: null });
        this.mixer = new THREE.AnimationMixer(root);
        this.clips = {};
        clips.forEach(c => { this.clips[c.name] = c; });
        this.actions = {};
        this.weights = {};
        // Joint nodes by bone name ('arm_l1', ...). They hold position + rotation; each has a
        // '<name>_scale' child that is the actual skin bone (see brres_to_glb.py add_rigged_driver).
        this.bones = {};
        root.traverse(o => { if (o.name && !(o.name in this.bones)) this.bones[o.name] = o; });
        // The animated (pre-IK) pose from last frame, put back before animating. three.js only
        // writes a bone when its animated value changes, so bones must hold exactly what the mixer
        // last wrote; otherwise last frame's IK result leaks in and the arms flip every frame.
        this.preIK = Object.values(this.bones).map(b => [b, b.position.clone(), b.quaternion.clone(), b.scale.clone()]);
        this.kartSpace = null;   // object whose local space is the kart's (for IK targets)
        this.handle = null;      // bike handlebar node (bike hand targets are in its space)
        this.steer = 0;
        this.baseName = 'drive';
        this.overlay = null;     // { name, until } one-shot/held clip over the base
        this.prevFlags = 0;
        this.finished = false;
        this.tmp = { v: [0, 1, 2, 3, 4, 5].map(() => new THREE.Vector3()), q: new THREE.Quaternion(), q2: new THREE.Quaternion() };
      }

      action(name) {
        if (!this.clips[name]) return null;
        if (!this.actions[name]) {
          const a = this.mixer.clipAction(this.clips[name]);
          a.play();
          a.setEffectiveWeight(0);
          this.actions[name] = a;
          this.weights[name] = 0;
        }
        return this.actions[name];
      }

      playOverlay(name, loop) {
        const a = this.action(name);
        if (!a) return;
        a.reset();
        a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
        a.clampWhenFinished = true;
        a.paused = false;
        this.overlay = { name, loop };
      }

      // Once per physics step
      step(flags, speed, hopStickX, stickX, stage) {
        // Must snapshot the OLD flags before overwriting this.prevFlags below -- rose() only reads
        // it when actually called further down, so without this snapshot it always compares flags
        // against itself (edge-detection permanently broken, trick overlays never trigger).
        const prevFlags = this.prevFlags;
        const rose = bit => (flags & bit) && !(prevFlags & bit);
        this.prevFlags = flags;
        this.steer += (stickX - this.steer) * STEER_SMOOTHING;

        if (flags & SND.WHEELIE && this.clips.wheelie) this.baseName = 'wheelie';
        else if (flags & SND.DRIFT) this.baseName = hopStickX < 0 ? 'drift_r' : 'drift_l';  // Kinoko: -1 = right
        else if (speed < -2 && this.clips.back) this.baseName = 'back';
        else if (flags & (SND.BOOST | SND.MUSHROOM) && this.clips.dash) this.baseName = 'dash';
        else this.baseName = 'drive';

        if (stage >= 3 && !this.finished) {
          this.finished = true;
          this.playOverlay(this.clips.good ? 'good' : '1st', true);
        } else if (!this.finished) {
          if (rose(SND.TRICK)) {
            const pool = this.isBike ? (flags & SND.LONG_AIR ? BIKE_TRICKS_LONG : BIKE_TRICKS_SHORT) : KART_TRICKS;
            const list = pool.filter(n => this.clips[n]);
            if (list.length) this.playOverlay(list[Math.floor(Math.random() * list.length)], false);
          }
          if (flags & SND.HIT) {
            if (!this.overlay || this.overlay.name !== 'damage') this.playOverlay('damage', true);
          } else if (this.overlay && this.overlay.name === 'damage') {
            this.overlay = null;
          }
        }
      }

      // Once per rendered frame, after the kart and handlebars are positioned
      update(dt) {
        if (this.overlay && !this.overlay.loop) {
          const a = this.actions[this.overlay.name];
          if (a && a.time >= a.getClip().duration - 1e-3) this.overlay = null;
        }
        for (const [b, p, q, sc] of this.preIK) { b.position.copy(p); b.quaternion.copy(q); b.scale.copy(sc); }
        const base = this.action(this.baseName) || this.action('drive');
        const k = Math.min(1, dt / CLIP_FADE_S);
        const overlayName = this.overlay && this.overlay.name;
        for (const [name, a] of Object.entries(this.actions)) {
          const target = name === overlayName ? 1 : (a === base && !overlayName ? 1 : 0);
          this.weights[name] += (target - this.weights[name]) * k;
          if (Math.abs(this.weights[name] - target) < 1e-3) this.weights[name] = target;
          a.setEffectiveWeight(this.weights[name]);
          if (name !== overlayName) {
            // steering blend: frame 0 = full right, last frame = full left
            a.paused = true;
            a.time = a.getClip().duration * (1 - this.steer) / 2;
          }
        }
        this.mixer.update(dt);
        for (const entry of this.preIK) { entry[1].copy(entry[0].position); entry[2].copy(entry[0].quaternion); entry[3].copy(entry[0].scale); }
        const ikWeight = overlayName ? 1 - this.weights[overlayName] : 1;
        if (ikWeight > 0.01) this.solveIK(ikWeight);
      }

      solveIK(weight) {
        if (!this.ik || !this.kartSpace) return;
        this.root.updateMatrixWorld(true);
        const [t] = this.tmp.v;
        // Several passes: the animations scale the arm/leg bones unevenly (stretchy limbs), which
        // makes a single analytic pass land a few units short; each pass closes most of the gap.
        for (let pass = 0; pass < IK_PASSES; pass++)
        for (const [side, sign] of [['l', 1], ['r', -1]]) {
          if (this.ik.hand) {
            this.handTarget(sign, t);
            this.twoBone(`arm_${side}1`, `arm_${side}2`, `wrist_${side}1`, t, weight);
          }
          if (this.ik.foot) {
            t.set(this.ik.foot[0] * sign, this.ik.foot[1], this.ik.foot[2]);
            this.kartSpace.localToWorld(t);
            this.twoBone(`leg_${side}1`, `leg_${side}2`, `ankle_${side}1`, t, weight);
          }
        }
      }

      handTarget(sign, out) {
        out.set(this.ik.hand[0] * sign, this.ik.hand[1], this.ik.hand[2]);
        return (this.ik.handSpace === 'handle' && this.handle ? this.handle : this.kartSpace).localToWorld(out);
      }

      // Bend a -> b -> c (shoulder, elbow, wrist) so c reaches target, keeping the bend plane
      twoBone(an, bn, cn, target, weight) {
        const a = this.bones[an], b = this.bones[bn], c = this.bones[cn];
        if (!a || !b || !c) return;
        const [, s, e, w, u, v] = this.tmp.v;
        a.getWorldPosition(s); b.getWorldPosition(e); c.getWorldPosition(w);
        const l1 = e.distanceTo(s), l2 = w.distanceTo(e);
        u.subVectors(target, s);
        const dist = THREE.MathUtils.clamp(u.length(), Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
        u.normalize();
        v.subVectors(e, s);
        v.addScaledVector(u, -v.dot(u));
        if (v.lengthSq() < 1e-8) v.set(1, 0, 0).cross(u);
        v.normalize();
        const along = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
        const newE = v.multiplyScalar(Math.sqrt(Math.max(l1 * l1 - along * along, 0))).addScaledVector(u, along).add(s);
        this.rotateToward(a, e.sub(s), newE.clone().sub(s), weight);
        a.updateMatrixWorld(true);
        b.getWorldPosition(e); c.getWorldPosition(w);
        const goal = s.addScaledVector(u, dist);
        this.rotateToward(b, w.sub(e), goal.sub(e), weight);
        b.updateMatrixWorld(true);
      }

      // Rotate a bone (in world space, about its own joint) so direction `from` turns to `to`
      rotateToward(bone, from, to, weight) {
        const { q, q2 } = this.tmp;
        q.setFromUnitVectors(from.normalize(), to.normalize());
        if (weight < 1) q.slerp(q2.identity(), 1 - weight);
        bone.getWorldQuaternion(q2);
        q.multiply(q2);                                   // new world rotation
        bone.parent.getWorldQuaternion(q2);
        bone.quaternion.copy(q2.invert().multiply(q));    // back to the parent's space
      }
    }
    window.addEventListener('keydown', () => sound.resume());
    window.addEventListener('click',   () => sound.resume());

    // --- Course Music (BRSTM streams, decoded in the browser) ---

    // Decodes a BRSTM (DSP-ADPCM or PCM16) into an AudioBuffer. Only the first `maxChannels`
    // channels are kept: tracks with 4-8 channels store extra layers the game fades in by area
    // (e.g. Koopa Cape underwater), and the first stereo pair is the main mix.
    function decodeBrstm(ctx, arrayBuffer, maxChannels = 2) {
      const d = new DataView(arrayBuffer);
      const u8 = new Uint8Array(arrayBuffer);
      const u32 = o => d.getUint32(o);
      if (u32(0) !== 0x5253544D) throw new Error('Not a BRSTM'); // "RSTM"

      const hb = u32(0x10) + 8;
      const si = hb + u32(hb + 4);
      const ct = hb + u32(hb + 0x14);
      const fmt = u8[si], looped = !!u8[si + 1], nch = u8[si + 2];
      const rate = d.getUint16(si + 4);
      const loopStart = u32(si + 8), total = u32(si + 0xC);
      const dataOff = u32(si + 0x10);
      const nblocks = u32(si + 0x14), bsize = u32(si + 0x18), bsamp = u32(si + 0x1C);
      const lbpad = u32(si + 0x28);
      if (fmt !== 1 && fmt !== 2) throw new Error('Unsupported BRSTM format ' + fmt);

      const outCh = Math.min(nch, maxChannels);
      const buffer = ctx.createBuffer(outCh, total, rate);
      for (let c = 0; c < outCh; c++) {
        const out = buffer.getChannelData(c);
        const ai = hb + u32(hb + u32(ct + 4 + 8 * c + 4) + 4);
        const coefs = [];
        for (let k = 0; k < 16; k++) coefs.push(d.getInt16(ai + 2 * k));
        let h1 = d.getInt16(ai + 0x24), h2 = d.getInt16(ai + 0x26);
        let i = 0;

        for (let b = 0; b < nblocks; b++) {
          const last = b === nblocks - 1;
          const nsamp = last ? total - bsamp * b : bsamp;
          let off = dataOff + b * bsize * nch + c * (last ? lbpad : bsize);
          const end = i + nsamp;

          if (fmt === 1) {
            for (; i < end; i++, off += 2) out[i] = d.getInt16(off) / 32768;
            continue;
          }
          while (i < end) {  // DSP-ADPCM: 8-byte frames of 14 samples
            const ps = u8[off];
            const scale = (1 << (ps & 0xF)) * 2048;
            const ci = (ps >> 4) * 2;
            const c1 = coefs[ci] || 0, c2 = coefs[ci + 1] || 0;
            for (let n = 0; n < 14 && i < end; n++) {
              const byte = u8[off + 1 + (n >> 1)];
              let nib = n & 1 ? byte & 0xF : byte >> 4;
              if (nib >= 8) nib -= 16;
              // Math.floor instead of >> 11: the sum can exceed 32-bit range

    // Follows the race like the game: start fanfare during the intro, course music from "GO",

    class MusicPlayer {
      constructor(sound) {

        this.tracks = {};     // normal / final / start / goal -> decoded BRSTM
        this.current = null;  // { src, gain }

      }

      async load(courseId) {
        const ctx = this.sound.ctx;
        const music = this.sound.manifest && this.sound.manifest.music;
        if (!ctx || !music) return;

        this.gain = ctx.createGain();
        this.gain.gain.value = 0.55;
        this.gain.connect(ctx.destination);

        const files = Object.assign({}, music.courses[courseId] || {}, music.jingles);
        await Promise.all(Object.entries(files).map(async ([key, file]) => {
          if (!file) return;

          if (!res.ok) return;

        this.stop();

        if (!t) return;
        const ctx = this.sound.ctx;
        const src = ctx.createBufferSource();
        src.buffer = t.buffer;
        if (loop && t.looped) {
          src.loop = true;
          src.loopStart = t.loopStart;
          src.loopEnd = t.loopEnd;

        src.connect(gain).connect(this.gain);

        clearTimeout(this.finalLapTimer);

        const { src, gain } = this.current;
        const t = this.sound.ctx.currentTime;
        gain.gain.setValueAtTime(gain.gain.value, t);

      step(stage, lap) {

          else if (stage === 1) this.stop(0.5);
          else if (stage === 2) this.play('normal', true);
          else if (stage >= 3) this.play('goal', true);  // loops as the results music
          this.stage = stage;

        if (stage === 2 && lap !== this.lap) {
          if (lap === 3 && this.lap === 2) {
            this.stop(0.3);
            const fanfare = this.sound.sfx('final_lap', 1);
            const wait = fanfare ? fanfare.buffer.duration * 1000 : 0;
            this.finalLapTimer = setTimeout(() => this.play('final', true), wait);

` +
          `CPU  physics ${P.phys.toFixed(2)} ms x${P.steps}   effects/ghost ${P.fx.toFixed(2)}   objects ${P.objs.toFixed(2)}   draw ${P.render.toFixed(2)}
` +
          `busy ${(P.phys + P.fx + P.objs + P.render).toFixed(1)} ms of ${avg.toFixed(1)} ms per frame  ->  ${(P.phys + P.fx + P.objs + P.render) < avg * 0.75 ? 'waiting on the display / browser frame pacing, not on the page' : 'limited by the page (CPU)'}
` +
          (P.gpu !== null ? `GPU  ${P.gpu.toFixed(2)} ms
` : `GPU  (timer query unavailable)
`) +
          `draw calls ${info.render.calls}   triangles ${(info.render.triangles / 1000).toFixed(0)}k   points ${info.render.points}
` +
          `geometries ${info.memory.geometries}   textures ${info.memory.textures}   programs ${info.programs ? info.programs.length : '?'}${mem}
` +

    const KINOKO_ASSET_VERSION = Date.now();

    // Records a ghost's whole run. Returns per-frame arrays; frame 0 is the pose before the first step.

    window.replayRun = async function (o = {}) {

        if (o.quant) x = Math.round(x * 7) / 7;
        G._kinoko_set_input(buttons, x, 0, 0);
        G._kinoko_step();
        G._kinoko_get_kart_pos(pos); G._kinoko_get_camera(cam); const fl = G._kinoko_get_kart_state(mot) >>> 0;
        const F = G.HEAPF32;
        out.pos.push([F[pos / 4], F[pos / 4 + 1], F[pos / 4 + 2]]);
        out.eye.push([F[cam / 4], F[cam / 4 + 1], F[cam / 4 + 2]]);
        out.tgt.push([F[cam / 4 + 3], F[cam / 4 + 4], F[cam / 4 + 5]]);
        out.fov.push(F[cam / 4 + 6]); out.dbg.push(Array.from(F.subarray(cam / 4 + 7, cam / 4 + 13))); out.flags.push(fl); out.dstate.push(F[mot / 4 + 2]);
      }
      // compare: sim step k (state after k+1 steps) against the real frame with race frame k+1+shift
      const shift = o.shift ?? 0;
      const pe = [], ee = [], te = [], fe = [];
      for (let k = 0; k < N; k++) {
        const r = data[k + 1 + shift]; if (!r) continue;
        const dist = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1], u[2] - v[2]);
        pe.push(dist(out.pos[k], r.kart)); ee.push(dist(out.eye[k], r.eye)); te.push(dist(out.tgt[k], r.tgt)); fe.push(Math.abs(out.fov[k] - r.fov));
      }
      const st = a => { const b = [...a].sort((x, y) => x - y); return { mean: +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(2), median: +b[b.length >> 1].toFixed(2), p95: +b[Math.floor(b.length * 0.95)].toFixed(1), max: +b[b.length - 1].toFixed(1) }; };
      const series = i => ({ k: i, pos: pe[i] && +pe[i].toFixed(1), eye: ee[i] && +ee[i].toFixed(1), tgt: te[i] && +te[i].toFixed(1), fov: fe[i] && +fe[i].toFixed(2) });
      return { pos: st(pe), eye: st(ee), tgt: st(te), fov: st(fe), samples: [300, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1400, 1600, 1750].map(series), raw: o.raw ? out : undefined };
    };

    // Makes a material read as a ghost: light-blue tint, half transparent. Cut-out textures (alpha
    // cutoff 0.5) must get a lower cutoff, or opacity 0.5 would push every opaque texel under it and
    // discard them at random (speckles).
    function ghostify(mesh) {
      if (!mesh.isMesh) return;
      const m = mesh.material = mesh.material.clone();
      m.transparent = true; m.opacity = 0.55; m.alphaTest = m.alphaTest ? 0.2 : 0;
      m.depthWrite = true;
      m.color.multiply(new THREE.Color(0x9fd8ff));
      mesh.renderOrder = 10;
    }

    // Draws a recorded ghost: translucent kart + animated driver, placed from the recording.
    class GhostRig {
      // opts.solid: an ordinary opaque kart (a CPU racer) instead of the translucent tinted ghost
      constructor(scene, ghost, opts = {}) {
        this.rec = ghost.rec; this.info = ghost.info; this.solid = !!opts.solid;
        this.group = new THREE.Group();
        scene.add(this.group);
        this.tires = []; this.fed = -1; this.animator = null; this.handle = null;
      }

      async load() {
        const info = this.info, vehFile = VEHICLE_FILES[info.vehicle];
        const charIdx = info.character < CHARACTER_FILES.length ? info.character : 0;   // Mii ghosts borrow Mario's model
        const dir = `assets/karts/${vehFile}-${CHARACTER_FILES[charIdx]}`;
        const loader = new THREE.GLTFLoader();
        const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
        const [kg, dg, manifest] = await Promise.all([load(`${dir}/kart.glb`), load(`${dir}/driver.glb`),
                                                       fetch('assets/karts/karts.json').then(r => r.json()).catch(() => ({}))]);
        const kart = kg.scene, driver = dg.scene;
        driver.traverse(c => { if (c.isSkinnedMesh) c.frustumCulled = false; });
        const isBike = vehFile.endsWith('_bike');
        const parts = {};
        kart.children.forEach(c => { parts[c.name] = c; });
        const models = isBike ? [parts.tire_f, parts.tire_r] : [parts.tire_fl, parts.tire_fr];
        this.tireRadius = models[0] ? new THREE.Box3().setFromObject(models[0]).getSize(new THREE.Vector3()).y / 2 : 30;
        const hi = (manifest[vehFile] || {}).handle;
        if (isBike && parts.handle && hi) { parts.handle.position.fromArray(hi.position); parts.handle.rotation.x = THREE.MathUtils.degToRad(hi.rake); }
        const placed = new Set(['body', 'handle', ...(isBike ? ['tire_f', 'tire_r'] : ['tire_fl', 'tire_fr'])]);
        kart.children.forEach(c => { if (!placed.has(c.name)) c.visible = false; });
        models.forEach(t => t && kart.remove(t));
        this.group.add(kart, driver);

        for (let i = 0; i < this.rec.nw; i++) {
          const holder = new THREE.Group(), spin = new THREE.Group();
          holder.add(spin); holder.userData.spin = spin;
          this.group.add(holder); this.tires.push(holder);
        }
        this.models = models; this.isBike = isBike;
        this.handle = isBike ? parts.handle : null;
        this.shadow = parts.shadow ? makeKartShadow(parts.shadow) : null;     // the ghost's own ground shadow (half strength, like the ghost itself)

        // Translucent and tinted so it reads as a ghost, and doesn't hide your own kart
        if (!this.solid) this.group.traverse(ghostify);
        this.animator = new DriverAnimator(driver, dg.animations, dg.scene.userData, isBike);
        this.animator.kartSpace = this.group;
        this.animator.handle = this.handle;
      }

      // The game's camera for this ghost at physics step k + alpha: [eye x, y, z, look-at x, y, z, fov]
      camera(k, alpha) {
        const R = this.rec, t = Math.min(Math.max(k - 1 + alpha, 0), R.n - 1), i0 = Math.floor(t), i1 = Math.min(i0 + 1, R.n - 1), a = t - i0;
        const out = [];
        for (let o = 0; o < 7; o++) out.push(R.cam[i0 * 7 + o] + (R.cam[i1 * 7 + o] - R.cam[i0 * 7 + o]) * a);
        return out;
      }

      // k: physics steps taken so far, alpha: how far into the next step (same as the player's kart)
      render(k, alpha, dt) {
        const R = this.rec, t = Math.min(Math.max(k - 1 + alpha, 0), R.n - 1);
        const i0 = Math.floor(t), i1 = Math.min(i0 + 1, R.n - 1), a = t - i0;
        const lerp = (arr, i, j, o) => arr[i * 16 + o] + (arr[j * 16 + o] - arr[i * 16 + o]) * a;

        this.group.position.set(R.pos[i0 * 3] + (R.pos[i1 * 3] - R.pos[i0 * 3]) * a,
                                R.pos[i0 * 3 + 1] + (R.pos[i1 * 3 + 1] - R.pos[i0 * 3 + 1]) * a,
                                R.pos[i0 * 3 + 2] + (R.pos[i1 * 3 + 2] - R.pos[i0 * 3 + 2]) * a);
        const q0 = new THREE.Quaternion().fromArray(R.quat, i0 * 4), q1 = new THREE.Quaternion().fromArray(R.quat, i1 * 4);
        this.group.quaternion.copy(q0).slerp(q1, a);
        updateKartShadow(this.shadow, this.group, this.solid ? 1 : 0.5);

        const spinAngle = R.spin[i0] + (R.spin[i1] - R.spin[i0]) * a;
        this.tires.forEach((holder, i) => {
          const o = 4 * i;
          holder.position.set(lerp(R.wheels, i0, i1, o), lerp(R.wheels, i0, i1, o + 1), lerp(R.wheels, i0, i1, o + 2));
          const spin = holder.userData.spin;
          if (!spin.children.length) {
            const m = this.models;
            const src = m.length === 2 && m[0] && m[0].name === 'tire_f' ? (holder.position.z > 0 ? m[0] : m[1]) : (holder.position.x > 0 ? m[0] : m[1]);
            if (src) {
              const c = src.clone();
              if (!this.solid) c.traverse(ghostify);
              spin.add(c);
            }
          }
          spin.rotation.x = spinAngle;
          const r = lerp(R.wheels, i0, i1, o + 3);
          if (r) spin.scale.setScalar(r / this.tireRadius);
        });

        // Driver animation follows the ghost's own steering, drifts and tricks, frame by frame
        while (this.fed < i0) {
          this.fed++;
          const f = this.fed;
          this.animator.step(R.flags[f], R.speed[f], R.hop[f], R.stick[f], R.stage[f]);
        }
        const steerAngle = -this.animator.steer * MAX_WHEEL_STEER;
        if (this.handle) this.handle.rotation.y = steerAngle;
        this.tires.forEach(h => { h.rotation.y = h.position.z > 0 ? steerAngle : 0; });
        this.group.updateMatrixWorld(true);
        this.animator.update(dt);
      }
    }

    // How far the player is from the ghost at the same point of the race, in ms (+ = behind).
    // Looks up when the ghost reached the player's race completion.
    function ghostGapMs(ghost, timeMs, completion) {
      const R = ghost.rec, env = R.compEnv;
      if (!(completion > env[0])) return timeMs - R.timeMs[0];
      if (completion > env[R.n - 1]) return timeMs - R.finalMs;
      let lo = 0, hi = R.n - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (env[mid] >= completion) hi = mid; else lo = mid + 1; }
      const e0 = env[lo - 1], e1 = env[lo], f = e1 > e0 ? (completion - e0) / (e1 - e0) : 1;
      return timeMs - (R.timeMs[lo - 1] + f * (R.timeMs[lo] - R.timeMs[lo - 1]));
    }
    const fmtGap = ms => (ms >= 0 ? '+' : '-') + (Math.abs(ms) / 1000).toFixed(3);

    // -- Menu and drag-and-drop --
    // slot 1 is the usual "race against this ghost" pick (also switches the loaded track); slot 2
    // is a second ghost loaded and simulated alongside the first purely for comparing them (their
    // gap is shown in ghostGapLabel) -- it stays on whatever track is already loaded rather than
    // switching tracks itself.
    const ghostSelect = document.getElementById('ghostSelect');
    const ghost2Select = document.getElementById('ghost2Select');
    let ghostList = [];
    const ghostKey = slot => slot === 2 ? 'mkw_ghost2' : 'mkw_ghost';
    const ghostCourseKey = slot => slot === 2 ? 'mkw_ghost2_course' : 'mkw_ghost_course';

    function chooseGhost(value, course, slot = 1) {
      try {
        if (value) {
          localStorage.setItem(ghostKey(slot), value); localStorage.setItem(ghostCourseKey(slot), course);
          if (slot === 1) localStorage.setItem('mkw_track', course);
        } else { localStorage.removeItem(ghostKey(slot)); localStorage.removeItem(ghostCourseKey(slot)); }
      } catch (e) { alert('Could not save the ghost choice: ' + e); return; }
      location.reload();
    }

    async function loadStoredGhost(slot = 1) {
      let v = null;
      try { v = localStorage.getItem(ghostKey(slot)); } catch (e) {}
      if (!v) return null;
      try {
        let bytes, label;
        if (v.startsWith('sample:')) {
          const r = await fetch('assets/ghosts/' + v.slice(7));
          if (!r.ok) throw new Error('missing ' + v);
          bytes = new Uint8Array(await r.arrayBuffer()); label = v.slice(7).replace(/\.rkg$/, '');
        } else if (v.startsWith('custom:')) {
          const bar = v.indexOf('|');
          label = v.slice(7, bar); bytes = b64ToBytes(v.slice(bar + 1));
        } else return null;
        return { info: parseRkg(bytes), bytes, label };
      } catch (e) {
        console.warn('Stored ghost unusable:', e);
        return null;
      }
    }

    async function buildGhostMenu() {
      try { ghostList = await (await fetch('assets/ghosts/ghosts.json')).json(); } catch (e) { ghostList = []; }
      const byCourse = new Map();
      TRACKS.forEach(t => byCourse.set(t.id, []));
      ghostList.forEach(g => { if (byCourse.has(g.course)) byCourse.get(g.course).push(g); });
      for (const sel of [ghostSelect, ghost2Select]) {
        TRACKS.forEach(t => {
          const list = byCourse.get(t.id).sort((a, b) => a.timeMs - b.timeMs);
          if (!list.length) return;
          const grp = document.createElement('optgroup'); grp.label = t.name;
          list.forEach(g => {
            const o = document.createElement('option');
            o.value = 'sample:' + g.file;
            const chr = (CHARACTERS.find(c => c.id === g.character) || {}).name || 'Mii', veh = (VEHICLES.find(x => x.id === g.vehicle) || {}).name || '?';
            o.text = `${fmtTime(g.timeMs)}  ${chr} / ${veh}  (${g.name})`;
            o.dataset.course = g.course;
            grp.appendChild(o);
          });
          sel.appendChild(grp);
        });
      }
      let cur = null; try { cur = localStorage.getItem('mkw_ghost'); } catch (e) {}
      if (cur && cur.startsWith('custom:')) {
        const o = document.createElement('option'); o.value = cur; o.text = 'Dropped: ' + cur.slice(7, cur.indexOf('|')); o.dataset.course = localStorage.getItem('mkw_ghost_course');
        ghostSelect.insertBefore(o, ghostSelect.children[1] || null);   // after "No ghost" (options inside groups aren't direct children)
      }
      if (cur) ghostSelect.value = cur;
      ghostSelect.onchange = () => { const o = ghostSelect.selectedOptions[0]; chooseGhost(ghostSelect.value, o ? o.dataset.course : null, 1); };

      let cur2 = null; try { cur2 = localStorage.getItem('mkw_ghost2'); } catch (e) {}
      if (cur2) ghost2Select.value = cur2;
      ghost2Select.onchange = () => { const o = ghost2Select.selectedOptions[0]; chooseGhost(ghost2Select.value, o ? o.dataset.course : null, 2); };
    }

    async function acceptDroppedFile(file) {
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const info = parseRkg(bytes);
        if (!TRACKS.some(t => t.id === info.course)) throw new Error('This ghost is on a course that is not available (' + info.course + ')');
        chooseGhost('custom:' + file.name.replace(/\.rkg$/i, '') + '|' + bytesToB64(bytes), info.course);
      } catch (e) { alert('Could not use that file: ' + e.message); }
    }

    (() => {
      const hint = document.getElementById('dropHint');

      const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
      window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; hint.style.display = 'flex'; e.preventDefault(); } });
      window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });

    const ghostReady = Promise.all([

    // --- Test camera views ---

    // rotation, so the kart stays framed the same way. Keys 1-9 pick a view (1 = normal chase cam),
    // drag with the mouse to orbit, scroll to zoom, double-click to reset the orbit.

    const CAMERA_VIEWS = [
      { name: 'Chase (normal)' },
      { name: 'Front',             az: 0,                el: 0.12, dist: 320 },
      { name: 'Front-left 3/4',    az: 0.8,              el: 0.2,  dist: 320 },
      { name: 'Left side',         az: Math.PI / 2,      el: 0.05, dist: 340 },
      { name: 'Rear',              az: Math.PI,          el: 0.2,  dist: 320 },
      { name: 'Right side',        az: -Math.PI / 2,     el: 0.05, dist: 340 },

      { name: 'Top',               az: Math.PI,          el: 1.45, dist: 420 },
      { name: 'Driver close-up',   az: 0.45,             el: 0.15, dist: 170, lookY: 75 },

    ];
    const chaseLike = () => camState.view === 0 || !!CAMERA_VIEWS[camState.view].ghost;
    const camState = { view: 0, orbitAz: 0, orbitEl: 0, zoom: 1 };
    try { camState.view = Math.min(parseInt(localStorage.getItem('mkw_cam')) || 0, CAMERA_VIEWS.length - 1); } catch (e) {}
    const camSelect = document.getElementById('camSelect');
    CAMERA_VIEWS.forEach((v, i) => {

    function setCameraView(i) {
      camState.view = i;
      camState.orbitAz = camState.orbitEl = 0;

    }

    camSelect.onchange = () => { setCameraView(parseInt(camSelect.value)); camSelect.blur(); };
    window.addEventListener('keydown', e => {
      const n = parseInt(e.key);

    // Place the camera for a test view: relative to the kart's position and full rotation
    const _camTarget = new THREE.Vector3(), _camOffset = new THREE.Vector3();
    function placeTestCamera(kart) {
      const v = CAMERA_VIEWS[camState.view];
      const az = v.az + camState.orbitAz;
      const el = THREE.MathUtils.clamp(v.el + camState.orbitEl, -1.4, 1.5);
      const dist = v.dist * camState.zoom;
      _camTarget.set(0, v.lookY || 50, 0).applyQuaternion(kart.quaternion).add(kart.position);
      _camOffset.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el))
        .multiplyScalar(dist).applyQuaternion(kart.quaternion);
      camera.position.copy(_camTarget).add(_camOffset);
      camera.up.set(0, 1, 0).applyQuaternion(kart.quaternion);

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 30, 300000);   // a near plane of 1 left too little depth precision: distant surfaces flickered (z-fighting)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // --- Bloom: the game's own post-effect (each course's posteffect.bblm, algorithm as in noclip's EGG port) ---
    // The finished frame is thresholded on its luminance, shrunk to 1/2, 1/4 and 1/8 of the Wii's 640x528 frame buffer, blurred
    // with rings of taps, tinted with the course's composite colour and blended back over the frame.
    class Bloom {
      constructor(renderer, cfg, dof, warpTex) {
        this.r = renderer; this.cfg = cfg; this.dof = dof || null;
        const lin = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false };
        const mk = (w, h) => new THREE.WebGLRenderTarget(w, h, lin);

        this.t2 = mk(this.W / 2, this.H / 2); this.t4 = mk(this.W / 4, this.H / 4); this.t4b = mk(this.W / 4, this.H / 4);
        this.t8 = mk(this.W / 8, this.H / 8); this.t8b = mk(this.W / 8, this.H / 8);
        this.main = new THREE.WebGLMultisampleRenderTarget(4, 4, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
        this.main.texture.encoding = THREE.sRGBEncoding;      // the frame is stored exactly as it was shown before (values in the game's gamma space)
        this.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); this.scene = new THREE.Scene();
        this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); this.quad.frustumCulled = false; this.scene.add(this.quad);
        const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
        const mat = (fs, uniforms, extra = {}) => new THREE.ShaderMaterial(Object.assign({ vertexShader: VS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false }, extra));
        this.copyMat = mat('varying vec2 vUv; uniform sampler2D uTex; void main(){ gl_FragColor = vec4(texture2D(uTex, vUv).rgb, 1.0); }', { uTex: { value: null } });
        // threshold: rgb * 2 * saturate(intensity(rgb) - threshold colour)
        const tScale = Math.floor(cfg.thresholdAmount * 219 + 16) / 255;
        this.thresholdMat = mat(`varying vec2 vUv; uniform sampler2D uTex; uniform vec3 uThr;
          void main(){ vec3 c = texture2D(uTex, vUv).rgb; float i = dot(c, vec3(0.257, 0.504, 0.098)) + 16.0 / 255.0;
            gl_FragColor = vec4(c * (2.0 * clamp(vec3(i) - uThr, 0.0, 1.0)), 1.0); }`,
          { uTex: { value: null }, uThr: { value: new THREE.Vector3(cfg.thresholdColor[0], cfg.thresholdColor[1], cfg.thresholdColor[2]).multiplyScalar(tScale) } });
        const f = x => x.toFixed(8);
        const blur = (numPasses, intensity, radius, w, h) => {
          const taps = 8, per = intensity / taps * 8;
          let funcs = '', code = '';
          for (let p = 0; p < numPasses; p++) {
            const n = (p + 1) * taps;
            funcs += `vec3 blurPass${p}(vec2 uv, vec2 asp){ vec3 c = vec3(0.0);\n`;
            for (let i = 0; i < n; i++) { const th = 2 * Math.PI * i / n; funcs += `c += texture2D(uTex, uv + asp * vec2(${f(Math.cos(th))} * ${f(radius)}, ${f(-Math.sin(th))} * ${f(radius)})).rgb * ${f(per)};\n`; }
            funcs += 'return c; }\n';
            code += `c += clamp(blurPass${p}(vUv, uAsp), 0.0, 1.0);\n`;
          }
          return mat(`varying vec2 vUv; uniform sampler2D uTex; uniform vec2 uAsp;\n${funcs}void main(){ vec3 c = vec3(0.0);\n${code}gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0); }`,
            { uTex: { value: null }, uAsp: { value: new THREE.Vector2(1 / w, 1 / h) } });
        };
        this.blur0 = blur(1, cfg.blur0Intensity, cfg.blur0Radius, this.W / 4, this.H / 4);
        this.blur1 = blur(cfg.blur1NumPasses, cfg.blur1Intensity, cfg.blur1Radius, this.W / 8, this.H / 8);
        const two = !!(cfg.blurFlags & 1);
        const blends = [[THREE.OneFactor, THREE.OneFactor], [THREE.OneMinusDstColorFactor, THREE.OneFactor], [THREE.SrcAlphaFactor, THREE.OneFactor],
                        [THREE.SrcAlphaFactor, THREE.OneMinusSrcAlphaFactor], [THREE.DstColorFactor, THREE.OneFactor]][cfg.compositeBlendMode] || [THREE.OneFactor, THREE.OneFactor];

          // -0.5 and the V shift +0.5 because the file's V runs top to bottom.

              vec3 stage0 = mix(c0, vec3(1.0), b.rgb);

              gl_FragColor = c2.z > 0.5 ? vec4(clamp((refT + road * rasc) * c2.y, 0.0, 1.0), vCol.a) : vec4(clamp(road * rasc * c2.y + refT * kalpha, 0.0, 1.0), vCol.a);
            #elif KIND == 16
              // Bowser's Castle's sky (kp_sky_v): stage 0 = (mix(C0, tex0, vertex colour) + 0.5) / 2; stage 1 = (K0 - mix(stage0, tex1, 0.5)) / 2, clamped

              vec4 b = texture2D(tB, (mB * vec3(vUv2, 1.0)).xy);

              // pochaYogan (Bowser's Castle lava splash): mix(C1, C0, tex0) + tex1 * C2; efPocha1 (hasB) also takes tex0's alpha
              vec4 b = texture2D(tB, (mB * vec3(vUv2, 1.0)).xy);
              gl_FragColor = vec4(clamp(mix(c1, c0, a.rgb) + b.rgb * c2, 0.0, 1.0), hasB > 0.5 ? a.a : 1.0);

              vec4 b = texture2D(tB, (mB * vec3(vEnv.x * 0.5 + 0.5, 0.5 - vEnv.y * 0.5, 1.0)).xy + off);   // ENV_CAMERA: (0.5 n.x + 0.5, -0.5 n.y + 0.5), then the SRT
              gl_FragColor = vec4(clamp(a.rgb * kcsel0 + b.rgb, 0.0, 1.0), 1.0);

    // Moonview Highway (and any course whose materials carry a 'Mi_LightMask' layer): the game adds a soft radial glow around the kart to the

    // projection is set up by the game at runtime. Measured from Dolphin frames at two places: the lit pool stays put on SCREEN (centred about

    const LM_KART = { value: new THREE.Vector3() }, LM_GAIN = 1.0;
    function toUnlit(src, patDir) {
      if (src.userData && src.userData.custom) return makeEffect(src.userData.custom, src.name);
      const m = new THREE.MeshBasicMaterial({
        name: src.name, map: src.map, aoMap: src.aoMap, aoMapIntensity: 1, vertexColors: src.vertexColors,
        color: src.color, side: src.side, transparent: src.transparent, opacity: src.opacity,

      if (src.userData && src.userData.tevScale) m.color.multiplyScalar(src.userData.tevScale);   // the game's x2 colour stage
      // The GX pipeline multiplies texture x vertex colour x shadow in gamma space, so leave the textures
      // undecoded and turn the result into linear before three.js encodes it for the screen. Baked

    // Maple Treeway's two screen-wide leaf ambiences (EnvKareha id 749, EnvKarehaUp id 753: placed at the origin with no settings,

    // one, leaves swirl around it: rk_leaf_effect, or rk_leaf_effectDash while it is boosting. One burst every 4 frames.
    if (selectedTrackObj.folder === 'treehouse_course') {

      (window.fxExtra = window.fxExtra || []).push(fxLeafEnv);

        const zones = objs.placements.filter(p => p.id === 373).map(p => ({ c: new THREE.Vector3(...p.pos), r2: (200 * (p.scale[0] || 1)) ** 2 }));
