          // (measured: 259 units back, 148 forward, then a steady 30 per frame) -- an erratic lurch the game never shows, since its cars have been
          // driving since the countdown. Cars stay hidden for their first 6 steps.
          if (flowName === 'car_body' || flowName === 'kart_truck') {
            if (uu.warmF !== sf) { uu.warmF = sf; uu.warm = (uu.warm || 0) + 1; }
            if (uu.warm < 6) holder.visible = false;
          }
          if (flowName === 'poihana' && holder.children[0] && holder.children[0].userData.mixerRef) {   // the walk cycle follows the ground speed (7 units/step at full pace), so the feet don't skate when it slows at a target
            if (uu.spdF !== sf) { uu.spd = uu.spdP ? uu.cPos.distanceTo(uu.spdP) / Math.max(1, sf - (uu.spdF || sf - 1)) : 7; uu.spdP = uu.cPos.clone(); uu.spdF = sf; }
            const act = holder.children[0].userData.mixerRef._actions[0];
            if (act) act.timeScale = Math.min(Math.max(uu.spd / 7, 0), 1.3);
          }
          const ia = Math.min(Math.max(alpha, 0), 1);
          holder.position.lerpVectors(uu.pPos, uu.cPos, ia);
          holder.quaternion.slerpQuaternions(uu.pQuat, uu.cQuat, ia);
          if (holder.visible && (flowName === 'WLfireringGC' || flowName === 'koopaFirebar' || flowName === 'WLfirebarGC')) this.billboardPart(holder, 'fireBPlane');
          if (holder.visible && BILLBOARD_OBJECTS.test((this.data.flow[String(id)] || {}).name || '')) this.billboards.push(holder);
        }
        this.billboards = [...new Set(this.billboards)];
        for (const h of this.dynamic) if (!used.has(h)) h.visible = false;
      }
    }
    const trackObjects = new TrackObjects();
    trackObjects.load();

    // --- Online play: rooms, live ghosts ---
    // Everyone simulates only their own kart. The other players are drawn as live ghosts from the pose packets they
    // stream (online.js), a few frames in the past so packet jitter never shows. A race starts by every page reloading
    // into the same room and the host releasing all of them at once (a clock-free "start in N ms" message).
    const net = (() => {
      const N = { room: null, id: null, name: '', host: false, race: false, players: new Map(), hostId: null, expected: [],
                  ready: false, holdUntil: 0, released: true, startSent: false, hostSeen: false, sentFinish: false, log: '' };
      const load = () => { try { return JSON.parse(sessionStorage.getItem('mkw_online') || 'null'); } catch (e) { return null; } };
      const save = o => { try { if (o) sessionStorage.setItem('mkw_online', JSON.stringify(o)); else sessionStorage.removeItem('mkw_online'); } catch (e) {} };
      const sess = load();
      const defaultRelay = () => { try { return localStorage.getItem('mkw_relay') || ''; } catch (e) { return ''; } };
      const relayGuess = () => defaultRelay() || `http://${location.hostname || 'localhost'}:8787`;
      const MAXF = 60 * 60 * 10;

      class NetRec {
        constructor(nw) {
          this.nw = nw; this.n = 0; this.finalMs = -1;
          this.pos = new Float32Array(MAXF * 3); this.quat = new Float32Array(MAXF * 4); this.wheels = new Float32Array(MAXF * 16);
          this.flags = new Uint32Array(MAXF); this.speed = new Float32Array(MAXF); this.hop = new Float32Array(MAXF); this.stick = new Float32Array(MAXF);
          this.stage = new Int32Array(MAXF); this.timeMs = new Int32Array(MAXF); this.spin = new Float32Array(MAXF);
        }
        put(p) {
          const i = p.frame; if (i >= MAXF) return;
          for (let j = this.n; j < i; j++) this.copy(j, j - 1);      // a lost packet: hold the last known pose
          this.pos.set(p.pos, i * 3); this.quat.set(p.quat, i * 4); this.wheels.set(p.wheels, i * 16);
          this.flags[i] = p.flags; this.speed[i] = p.speed; this.hop[i] = p.hop; this.stick[i] = p.stick;
          this.stage[i] = p.stage; this.timeMs[i] = p.timeMs; this.spin[i] = p.spin;
          if (i >= this.n) this.n = i + 1;
        }
        copy(to, from) {
          if (from < 0) return;
          for (const [a, w] of [[this.pos, 3], [this.quat, 4], [this.wheels, 16]]) a.copyWithin(to * w, from * w, from * w + w);
          for (const a of [this.flags, this.speed, this.hop, this.stick, this.stage, this.timeMs, this.spin]) a[to] = a[from];
        }
      }

      // ---- panel ----
      const css = document.createElement('style');
      css.textContent = `#netPanel{position:fixed;left:8px;top:96px;z-index:30;background:rgba(15,20,30,.94);color:#e8eef8;font:13px/1.4 sans-serif;padding:10px 12px;border-radius:8px;min-width:300px;max-width:360px;display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
        #netPanel input{background:#1c2536;color:#fff;border:1px solid #3a4866;border-radius:4px;padding:3px 6px;font:inherit}
        #netPanel .row{margin:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap} #netPanel .pl{margin:2px 0;padding:3px 6px;background:#1c2536;border-radius:4px}
        #netPanel small{color:#9fb0cc}`;
      document.head.appendChild(css);
      const panel = document.createElement('div'); panel.id = 'netPanel'; document.body.appendChild(panel);
      const btn = document.createElement('button'); btn.id = 'netBtn'; btn.textContent = 'Online'; btn.style.marginLeft = '6px'; btn.title = 'Race other players live (ghosts streamed over WebRTC)';
      document.getElementById('perfBtn').after(btn);
      let open = !!sess;
      btn.onclick = () => { open = !open; draw(); };
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const charName = id => (CHARACTERS.find(c => c.id === id) || { name: '?' }).name, vehName = id => (VEHICLES.find(v => v.id === id) || { name: '?' }).name;
      const fmtT = ms => { const s = ms / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, '0')}`; };

      function draw() {
        panel.style.display = open ? 'block' : 'none'; if (!open) return;
        const inRoom = !!N.room;
        let h = `<div><strong>Online</strong> <small>${esc(N.log || '')}</small></div>`;
        if (!inRoom) {
          h += `<div class="row">Name <input id="netName" size="12" maxlength="16" value="${esc(N.name || (localStorage.getItem('mkw_name') || 'Player'))}"></div>
                <div class="row">Relay <input id="netRelay" size="26" value="${esc(relayGuess())}"></div>
                <div class="row"><button id="netHost">Host a room</button> or code <input id="netCode" size="5" maxlength="8" style="text-transform:uppercase"><button id="netJoin">Join</button></div>
                <small>Start the relay with <code>node server/signal.js</code>. Everyone must reach the same relay address.</small>`;
        } else {
          h += `<div class="row">Room <strong style="font-size:18px;letter-spacing:2px">${esc(N.room)}</strong> <small>${N.host ? 'you are the host' : ''}</small></div>`;
          h += `<div class="pl">${esc(N.name)} (you) <small>${esc(charName(selectedCharObj.id))} / ${esc(vehName(selectedVehObj.id))}</small></div>`;
          N.players.forEach(p => {
            h += `<div class="pl">${esc(p.name || '...')}${p.host ? ' (host)' : ''} <small>${p.veh !== undefined ? esc(charName(p.char)) + ' / ' + esc(vehName(p.veh)) : ''} ${p.rtt ? Math.round(p.rtt) + ' ms' : ''}${p.finish ? ' &middot; finished ' + fmtT(p.finish) : ''}</small></div>`;
          });
          if (!N.players.size) h += `<small>Waiting for players. Share the code above.</small>`;
          h += `<div class="row">`;
          if (N.host) h += `<button id="netStart" ${N.players.size ? '' : 'disabled'}>Start race on ${esc(selectedTrackObj.name)}</button>`;
          h += `<button id="netLeave">Leave</button></div>`;
          if (N.host) h += `<small>The host picks the track (Track menu) and starts; everyone reloads into the race. Pick your own kart before that.</small>`;
        }
        panel.innerHTML = h;
        const $ = id => panel.querySelector('#' + id);
        if (!inRoom) {
          const go = host => {
            const name = ($('netName').value || 'Player').trim().slice(0, 16), relay = $('netRelay').value.trim();
            let room = host ? Array.from(crypto.getRandomValues(new Uint8Array(4)), x => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[x % 24]).join('') : $('netCode').value.trim().toUpperCase();
            if (!room) { N.log = 'Enter a room code'; return draw(); }
            try { localStorage.setItem('mkw_name', name); localStorage.setItem('mkw_relay', relay); } catch (e) {}
            const s = { relay, room, id: (sess && sess.id) || crypto.getRandomValues(new Uint32Array(2)).join('').slice(0, 14).padStart(8, '0'), name, host, start: false, expected: [] };
            save(s); connect(s);
          };
          $('netHost').onclick = () => go(true); $('netJoin').onclick = () => go(false);
        } else {
          if ($('netStart')) $('netStart').onclick = () => startRace();
          $('netLeave').onclick = () => { save(null); if (N.conn) N.conn.close(); location.reload(); };
        }
      }

      // ---- connection ----
      let hostSince = 0;
      async function connect(s) {
        N.room = s.room; N.id = s.id; N.name = s.name; N.host = s.host; N.race = !!s.start; N.expected = s.expected || [];
        if (s.host) N.hostId = s.id;
        N.log = 'connecting...'; open = true; draw();
        if (N.race) { N.released = false; N.holdUntil = 0; N.raceLoadedAt = performance.now(); }
        N.conn = new OnlineRoom({ relay: s.relay, room: s.room, id: s.id, cb: {
          onStatus: t => { N.log = t; draw(); },
          onPeerOpen: id => { N.players.set(id, N.players.get(id) || { id }); hello(id); draw(); },
          onPeerGone: id => { const p = N.players.get(id); if (p && p.rig) { scene.remove(p.rig.group); } N.players.delete(id); draw(); },
          onMsg: onMsg, onPose: (id, pose) => { const p = N.players.get(id); if (p && p.rec) p.rec.put(pose); } } });
        try { await N.conn.connect(); N.log = N.race ? 'racing online' : 'connected'; } catch (e) { N.log = String(e.message || e); }
        draw();
      }
      const hello = to => {
        const m = { t: 'hello', name: N.name, char: selectedCharObj.id, veh: selectedVehObj.id, host: N.host, race: N.race, ready: N.ready };
        to ? N.conn.sendTo(to, m) : N.conn.broadcast(m);
      };

      async function makeRig(p) {
        if (p.rig || p.rigLoading || p.veh === undefined || !N.race) return;
        p.rigLoading = true;
        try {
          const bike = VEHICLE_FILES[p.veh].endsWith('_bike');
          p.rec = new NetRec(bike ? 2 : 4);
          const rig = new GhostRig(scene, { rec: p.rec, info: { vehicle: p.veh, character: p.char } });
          await rig.load(); rig.group.visible = false; p.rig = rig;
        } catch (e) { console.warn('could not load a player', e); N.log = 'could not load ' + p.name; draw(); }
      }

      function onMsg(id, m) {
        const p = N.players.get(id) || (N.players.set(id, { id }), N.players.get(id));
        if (m.t === 'hello') {
          Object.assign(p, { name: m.name, char: m.char, veh: m.veh, host: m.host, ready: m.ready });
          if (m.host) N.hostId = id;
          makeRig(p); maybeStart(); draw();
        } else if (m.t === 'ready') { p.ready = true; maybeStart(); }
        else if (m.t === 'go' && id === N.hostId) {
          try { localStorage.setItem('mkw_track', String(m.track)); } catch (e) {}
          const s = load(); if (s) { s.start = true; s.expected = m.expected; save(s); }
          location.reload();
        } else if (m.t === 'start' && id === N.hostId) {
          const rtt = (N.conn.peers.get(id) || {}).rtt || 0;
          N.holdUntil = performance.now() + m.in - rtt / 2;
        } else if (m.t === 'finish') { p.finish = m.ms; draw(); }
      }

      function startRace() {
        const ids = [...N.players.keys()];
        try { localStorage.setItem('mkw_track', String(selectedTrackObj.id)); localStorage.setItem('mkw_char', charSelect.value); localStorage.setItem('mkw_veh', vehSelect.value); } catch (e) {}
        N.conn.broadcast({ t: 'go', track: parseInt(trackSelect.value), expected: [...ids, N.id] });
        const s = load(); s.start = true; s.expected = ids; save(s);
        setTimeout(() => location.reload(), 250);
      }

      // Host: once every expected player has loaded the race, tell everyone to start together (in 2.5 s).
      function maybeStart() {
        if (!N.host || !N.race || N.startSent || !N.ready) return;
        const waiting = N.expected.filter(id => id !== N.id && !((N.players.get(id) || {}).ready));
        if (waiting.length && performance.now() - N.raceLoadedAt < 25000) return;
        N.startSent = true;
        N.conn.broadcast({ t: 'start', in: 2500 });
        N.holdUntil = performance.now() + 2500;
      }
      setInterval(() => { if (N.host && N.race && !N.startSent) maybeStart(); }, 500);

      const api = {
        state: N,
        // called when the race page has finished loading and is about to run
        raceReady() { N.ready = true; if (N.conn) { N.conn.broadcast({ t: 'ready' }); } maybeStart(); },
        // true while physics must wait for the shared start
        holding(now) {
          if (!N.race || N.released) return false;
          if (N.holdUntil && now >= N.holdUntil) { N.released = true; return false; }
          if (!N.holdUntil && N.raceLoadedAt && now - N.raceLoadedAt > 60000) { N.released = true; return false; }   // host never came: give up waiting
          return true;
        },
        holdText(now) { return N.holdUntil ? `Race starts in ${Math.max(0, (N.holdUntil - now) / 1000).toFixed(1)} s` : 'Waiting for the other players to load...'; },
        active() { return N.race && N.released; },
        sendPose(frame, own) {
          if (!N.conn || !N.race) return;
          N.conn.sendPose(packPose({ frame, ...own }));
          if (own.stage >= 4 && !N.sentFinish) { N.sentFinish = true; N.conn.broadcast({ t: 'finish', ms: own.finalMs }); }
        },
        render(k, alpha, dt) {
          if (!N.race || !N.conn) return;
          let rtt = 0; N.conn.peers.forEach(P => { rtt = Math.max(rtt, P.rtt || 0); if (N.players.has(P.id)) N.players.get(P.id).rtt = P.rtt; });
          const delay = 3 + Math.ceil(rtt / 2 / (1000 / 59.94));
          N.players.forEach(p => { if (p.rig) { p.rig.group.visible = p.rec.n > 1; if (p.rec.n > 1) p.rig.render(Math.max(1, k - delay), alpha, dt); } });
        },
        redraw: draw,
        leaveRace() { const s = load(); if (s) { s.start = false; save(s); } },
      };
      setInterval(() => { if (open && N.room) draw(); }, 2000);
      if (sess) connect(sess); else draw();
      return api;
    })();

    // --- VS mode: CPU racers ---
    // The race is a real multi-kart Kinoko simulation (up to 12 karts, each with its own checkpoints, laps and grid slot). The player is
    // kart 0; each CPU is another kart whose controller is written every frame by CpuDriver (cpu.js). The CPU karts are drawn with the
    // same rig as a ghost, solid instead of translucent, fed from the simulation every physics step.
    const VS = (() => {
      const V = { on: false, cpus: 0, racers: [], rank: 1, total: 1, sinceStart: -1 };
      try { V.on = localStorage.getItem('mkw_mode') === '1'; V.cpus = V.on ? Math.max(1, Math.min(11, parseInt(localStorage.getItem('mkw_cpus')) || 3)) : 0; } catch (e) {}

      // CPU character/vehicle picks: spread over the roster and the weight classes
      V.pick = i => {
        const character = (i * 7 + 3) % CHARACTER_FILES.length;
        const group = (i * 5) % 12;                                  // vehicles come in S/M/L triples per model
        return { character, vehicle: group * 3 + CHARACTER_CLASS[character] };
      };

      class LiveRec {
        constructor(nw, max = 60 * 60 * 12) {
          this.nw = nw; this.n = 0; this.finalMs = -1;
          this.pos = new Float32Array(max * 3); this.quat = new Float32Array(max * 4); this.wheels = new Float32Array(max * 16);
          this.flags = new Uint32Array(max); this.speed = new Float32Array(max); this.hop = new Float32Array(max); this.stick = new Float32Array(max);
          this.stage = new Int32Array(max); this.timeMs = new Int32Array(max); this.spin = new Float32Array(max);
        }
      }

      // Builds the CPU racers once the simulation exists
      V.setup = async (G) => {
        V.G = G;
        V.P = { pos: G._malloc(12), rot: G._malloc(16), mot: G._malloc(20), whl: G._malloc(64), inp: G._malloc(16), tim: G._malloc(64) };
        const route = await (await fetch(`assets/tracks/${selectedTrackObj.folder}/enemy.json`)).json();
        G._kinoko_get_kart_pos(V.P.pos);
        const F = G.HEAPF32; G._kinoko_set_focus(0); G._kinoko_get_kart_pos(V.P.pos);
        V.ring = buildEnemyRing(route, [F[V.P.pos / 4], F[V.P.pos / 4 + 2]]);
        for (let i = 1; i <= V.cpus; i++) {
          const pick = V.pick(i), bike = VEHICLE_FILES[pick.vehicle].endsWith('_bike');
          const rec = new LiveRec(bike ? 2 : 4);
          const rig = new GhostRig(scene, { rec, info: { vehicle: pick.vehicle, character: pick.character } }, { solid: true });
          await rig.load();
          rig.group.visible = false;
          V.racers.push({ idx: i, rec, rig, character: pick.character, vehicle: pick.vehicle, driver: new CpuDriver(G, i, V.ring), spin: 0, radius: 0, completion: 0, lap: 1 });
        }
        V.total = 1 + V.cpus;
      };

      // Before each physics step: the CPUs' inputs
      V.drive = () => { for (const r of V.racers) r.driver.drive(V.sinceStart); };

      // After each physics step (frame = the step count): record every CPU kart's pose for drawing, and rank the field
      V.capture = (frame) => {
        const G = V.G, P = V.P, F = G.HEAPF32, H = G.HEAP32;
        const q = new THREE.Quaternion(), v = new THREE.Vector3(), w = new THREE.Vector3();
        for (const r of V.racers) {
          const R = r.rec, n = frame;
          G._kinoko_set_focus(r.idx);
          G._kinoko_get_kart_pos(P.pos); G._kinoko_get_kart_rot(P.rot);
          const flags = G._kinoko_get_kart_state(P.mot) >>> 0, nw = G._kinoko_get_wheels(P.whl);
          G._kinoko_get_input(P.inp); G._kinoko_get_timing(P.tim);
          G._kinoko_set_focus(0);
          const pp = P.pos / 4, qp = P.rot / 4, mp = P.mot / 4, wp = P.whl / 4, ip = P.inp / 4, tp = P.tim / 4;
          R.pos.set([F[pp], F[pp + 1], F[pp + 2]], n * 3);
          R.quat.set([F[qp], F[qp + 1], F[qp + 2], F[qp + 3]], n * 4);
          q.set(F[qp], F[qp + 1], F[qp + 2], F[qp + 3]).invert(); v.set(F[pp], F[pp + 1], F[pp + 2]);
          for (let k = 0; k < nw; k++) {
            w.set(F[wp + 4 * k], F[wp + 4 * k + 1], F[wp + 4 * k + 2]).sub(v).applyQuaternion(q);
            R.wheels.set([w.x, w.y, w.z, F[wp + 4 * k + 3]], n * 16 + 4 * k);
          }
          if (nw) r.radius = F[wp + 3] || r.radius;
          r.spin += r.radius ? F[mp] / r.radius : 0;
          R.flags[n] = flags; R.speed[n] = F[mp]; R.hop[n] = F[mp + 4]; R.stick[n] = F[ip];
          R.stage[n] = H[tp + 2]; R.timeMs[n] = H[tp]; R.spin[n] = r.spin; R.n = n + 1;
          r.completion = H[tp + 7] / 10000; r.lap = H[tp + 1]; r.finished = H[tp + 6] >= 0;
          r.finalMs = H[tp + 6];
          if (n === 1) { for (const [a, m] of [[R.pos, 3], [R.quat, 4], [R.wheels, 16]]) a.copyWithin(0, m, 2 * m); for (const a of [R.flags, R.speed, R.hop, R.stick, R.stage, R.timeMs, R.spin]) a[0] = a[1]; }
        }
      };

      // Race position of the player (1 = first): who has completed more of the race. `mine` is the player's completion.
      V.updateRank = (mine) => { let rank = 1; for (const r of V.racers) if (r.completion > mine) rank++; V.rank = rank; return rank; };

      V.render = (k, alpha, dt) => { for (const r of V.racers) { r.rig.group.visible = r.rec.n > 2; if (r.rec.n > 2) r.rig.render(k, alpha, dt); } };
      return V;
    })();


    // --- Kinoko Wasm Setup ---
    KinokoModule(kinokoModuleConfig()).then(async (Module) => {
      statusEl.innerText = "Mounting Race Assets into MEMFS...";

      Module.FS.mkdir('/Race');
      Module.FS.mkdir('/Race/Course');

      async function loadAsset(url, vfsPath) {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to fetch: " + url);
        const buf = await res.arrayBuffer();
        Module.FS.writeFile(vfsPath, new Uint8Array(buf));
      }

      await loadAsset('assets/common/Common.szs', '/Race/Common.szs');
      await loadAsset(
        `assets/tracks/${selectedTrackObj.folder}/course.szs`,
        `/Race/Course/${selectedTrackObj.folder}.szs`
      );

      gameHud.setTrack(selectedTrackObj.folder);
      statusEl.innerText = "Initializing Race Simulation...";
      
      if (VS.on) {
        const ch = Module._malloc(4 * VS.cpus), vh = Module._malloc(4 * VS.cpus);
        for (let i = 0; i < VS.cpus; i++) { const pick = VS.pick(i + 1); Module.HEAP32[ch / 4 + i] = pick.character; Module.HEAP32[vh / 4 + i] = pick.vehicle; }
        Module._kinoko_init_vs(selectedTrackObj.id, selectedCharObj.id, selectedVehObj.id, VS.cpus, ch, vh);
      } else {
        Module._kinoko_init(selectedTrackObj.id, selectedCharObj.id, selectedVehObj.id);
      }

      const posPtr = Module._malloc(12);
      const quatPtr = Module._malloc(16);

      const MAX_OBJS = 2048;
      const OBJ_STRIDE = 15;   // id, pos x/y/z, rot x/y/z, scale x/y/z, animState, quat x/y/z/w -- see kinoko_get_objects
      const objBufPtr = Module._malloc(MAX_OBJS * OBJ_STRIDE * 4);

      const motionPtr = Module._malloc(5 * 4);
      const wheelPtr = Module._malloc(4 * 4 * 4);
      const floorPtr = Module._malloc(4 * 2 * 4);
      const racePtr = Module._malloc(16);
      const timingPtr = Module._malloc(16 * 4);

      window.Module = Module;
      window.objBufPtr = objBufPtr;

      await ghostReady;
      if (activeGhost) {
        try {
          statusEl.innerText = "Simulating ghost...";
          activeGhost.rec = await recordGhost(activeGhost, p => { statusEl.innerText = `Simulating ghost... ${Math.round(p * 100)}%`; });
          statusEl.innerText = "Loading ghost...";
          ghostRig = new GhostRig(scene, activeGhost);
          await ghostRig.load();
          hud.ghost = activeGhost;
          console.info(`Ghost ${activeGhost.label}: recorded ${activeGhost.rec.n} frames, finish ${activeGhost.rec.finalMs} ms vs file ${activeGhost.info.timeMs} ms -> ${activeGhost.rec.verified ? 'exact match' : 'MISMATCH'}`);
        } catch (err) {
          console.warn('Ghost disabled:', err);
          alert('The ghost could not be replayed: ' + (err.message || err));
          try { localStorage.removeItem('mkw_ghost'); localStorage.removeItem('mkw_ghost_course'); } catch (e) {}
          if (ghostRig) { scene.remove(ghostRig.group); ghostRig = null; }
          activeGhost = null;
        }
      }

      // Second ghost, purely for comparing against the first -- silently skipped (not an alert,
      // since picking a ghost for a different track than the one that just loaded is an easy
      // mistake, and it's the second ghost's fault rather than something breaking this race) if it
      // turns out to be on a different course than what actually loaded.
      if (activeGhost2 && activeGhost2.info.course === selectedTrackObj.id) {
        try {
          statusEl.innerText = "Simulating 2nd ghost...";
          activeGhost2.rec = await recordGhost(activeGhost2, p => { statusEl.innerText = `Simulating 2nd ghost... ${Math.round(p * 100)}%`; });
          statusEl.innerText = "Loading 2nd ghost...";
          ghostRig2 = new GhostRig(scene, activeGhost2, { solid: true });
          await ghostRig2.load();
          console.info(`Ghost 2 ${activeGhost2.label}: recorded ${activeGhost2.rec.n} frames, finish ${activeGhost2.rec.finalMs} ms vs file ${activeGhost2.info.timeMs} ms -> ${activeGhost2.rec.verified ? 'exact match' : 'MISMATCH'}`);
        } catch (err) {
          console.warn('2nd ghost disabled:', err);
          if (ghostRig2) { scene.remove(ghostRig2.group); ghostRig2 = null; }
          activeGhost2 = null;
        }
      } else if (activeGhost2) {
        console.warn(`2nd ghost is on a different course (${activeGhost2.info.course}) than the one that loaded (${selectedTrackObj.id}) -- skipped.`);
        activeGhost2 = null;
      }

      statusEl.innerText = "Loading sounds...";
      try {
        await sound.load(selectedCharObj.name, selectedVehObj.id);
        statusEl.innerText = "Loading music...";
        await music.load(selectedTrackObj.id);
      } catch (err) {
        console.warn('Sound disabled:', err);
      }

      hud.setBestKey(`mkw_best_${selectedTrackObj.id}_${selectedCharObj.id}_${selectedVehObj.id}`);

      statusEl.innerText = "Running!";

      // MKWii simulates at a fixed 59.94 Hz. Step physics on that clock, independent of the
      // display refresh rate, so 144 Hz monitors don't run the race 2.4x fast.
      const FRAME_MS = 1000 / 59.94;
      const MAX_STEPS_PER_RENDER = 5; // avoid a catch-up spiral after the tab was backgrounded
      let accumulator = 0;
      let lastTime = performance.now();
      let frameDt = FRAME_MS;

      // Kart state from the last two physics steps. Rendering blends between them so motion
      // stays smooth when the display rate doesn't match 59.94 Hz.
      const prevPos = new THREE.Vector3(), currPos = new THREE.Vector3();
      const prevQuat = new THREE.Quaternion(), currQuat = new THREE.Quaternion();

      // The game's own race camera (Kinoko's KartCamera): eye, look-at point and field of view, per physics step
      const camPtr = Module._malloc(16 * 4);
      const gameCam = { prev: null, curr: null };
      function readGameCamera() {
        if (!Module._kinoko_get_camera(camPtr)) return;
        const c = Array.from(Module.HEAPF32.subarray(camPtr / 4, camPtr / 4 + 7));
        gameCam.prev = gameCam.curr || c; gameCam.curr = c;
      }
      function readKartState() {
        readGameCamera();
        Module._kinoko_get_kart_pos(posPtr);
        Module._kinoko_get_kart_rot(quatPtr);
        const p = posPtr / 4, q = quatPtr / 4;
        currPos.set(Module.HEAPF32[p], Module.HEAPF32[p + 1], Module.HEAPF32[p + 2]);
        currQuat.set(Module.HEAPF32[q], Module.HEAPF32[q + 1], Module.HEAPF32[q + 2], Module.HEAPF32[q + 3]);
      }

      // Wheel centres in kart-local space for the last two physics steps, plus radii.
      let prevWheels = [], currWheels = [], wheelRadii = [];
      let tireSpin = 0, lastFlags = 0, kartEffects = null;
      const dustWheels = [new THREE.Vector3(), new THREE.Vector3()], dustVel = new THREE.Vector3();
      const invQuat = new THREE.Quaternion();

      function readWheels() {
        const n = Module._kinoko_get_wheels(wheelPtr);
        const w = wheelPtr / 4;
        invQuat.copy(currQuat).invert();
        prevWheels = currWheels;
        currWheels = [];
        for (let i = 0; i < n; i++) {
          const o = w + 4 * i;
          currWheels.push(new THREE.Vector3(Module.HEAPF32[o], Module.HEAPF32[o + 1], Module.HEAPF32[o + 2])
            .sub(currPos).applyQuaternion(invQuat));
          wheelRadii[i] = Module.HEAPF32[o + 3];
        }
        // Roll the tires by the distance travelled this step
        tireSpin += sound.motion.speed / (wheelRadii[0] || tireRadius);
      }

      function placeTires(alpha) {
        if (!tireMeshes.length || !currWheels.length) return;
        tireMeshes.forEach((holder, i) => {
          const cur = currWheels[i], prev = prevWheels[i] || cur;
          if (!cur) return;
          holder.position.lerpVectors(prev, cur, alpha);
          const spin = holder.userData.spin;
          if (!spin.children.length) {
            // Pick the model for this wheel from where it sits: +X is the kart's left side
            const models = tireMeshes.models;
            const src = models.length === 2 && models[0] && models[0].name === 'tire_f'
              ? (cur.z > 0 ? models[0] : models[1])
              : (cur.x > 0 ? models[0] : models[1]);
            if (src) spin.add(src.clone());
          }
          spin.rotation.x = tireSpin;
          // Rear tires reuse the front model at their own radius, as in the game
          if (wheelRadii[i]) spin.scale.setScalar(wheelRadii[i] / tireRadius);
        });
      }

      function readSoundState(input) {
        const flags = Module._kinoko_get_kart_state(motionPtr) >>> 0;
        // Rising edge of InCannon: the kart just started using a cannon. There's no per-cannon id exposed
        // natively, so trigger whichever placed DonkyCannon_wii is nearest the kart right now (see triggerCannon).
        if ((flags & SND.CANNON) && !(lastFlags & SND.CANNON)) trackObjects.triggerCannon(currPos);
        lastFlags = flags;
        if ((flags & SND.RESPAWN) && !((window.kartFlags | 0) & SND.RESPAWN) && window.splashKind) { trackObjects.lavaSplash(kartMesh.position); if (window.splashKind === 'pochaYogan') window.lavaFall = { eye: camera.position.clone(), pos: kartMesh.position.clone(), f: trackObjects.raceFrame || 0 }; }
        if (!(flags & SND.RESPAWN) && window.lavaFall) { window.lavaFall = null; kartMesh.visible = true; }
        window.kartFlags = flags;   // read by the course effect triggers set up at the top level
        const m = motionPtr / 4;
        const speed = Module.HEAPF32[m];
        sound.step(flags, speed, Module.HEAPF32[m + 1], Module.HEAPF32[m + 2]);

        Module._kinoko_get_race_state(racePtr);
        const r = racePtr / 4;
        trackObjects.raceFrame = Module.HEAP32[r + 3];
        trackObjects.raceStage = Module.HEAP32[r];   // RaceManager stage: 2+ = the race itself (after the countdown)
        music.step(Module.HEAP32[r], Module.HEAP32[r + 1]);

        if (driverAnimator) driverAnimator.step(flags, speed, Module.HEAPF32[m + 4], input.stickX, Module.HEAP32[r]);

        Module._kinoko_get_timing(timingPtr);
        const tm = timingPtr / 4, H = Module.HEAP32;
        if (VS.on) VS.updateRank(H[tm + 7] / 10000);
        hud.update({ time: H[tm], lap: H[tm + 1], stage: H[tm + 2], wrongWay: !!H[tm + 3],
                     lapEnds: [H[tm + 4], H[tm + 5], H[tm + 6]], countdown: H[r + 2], completion: H[tm + 7] / 10000, items: H[tm + 8] });
      }

      readKartState();
      prevPos.copy(currPos);
      prevQuat.copy(currQuat);

      // Frame limiter: 'display' draws on every screen refresh; 'game' draws at the game's own 59.94 fps (on a 60 Hz screen
      // this changes nothing; on 120/144 Hz screens it stops drawing the extra frames)
      const GAME_FRAME_MS = 1000 / 59.94, cap = { on: false, last: 0 };
      const capBtn = document.getElementById('capBtn');
      const setCap = on => { cap.on = on; capBtn.textContent = on ? 'FPS: 59.94' : 'FPS: display'; try { localStorage.setItem('mkw_cap', on ? '1' : '0'); } catch (e) {} };
      try { setCap(localStorage.getItem('mkw_cap') === '1'); } catch (e) {}
      capBtn.onclick = () => { setCap(!cap.on); capBtn.blur(); };
      window.addEventListener('keydown', e => { if (e.key === 'F4') { e.preventDefault(); setCap(!cap.on); } });

      function loop(now = performance.now()) {
        requestAnimationFrame(loop);
        if (cap.on) {
          const since = now - cap.last;
          if (since < GAME_FRAME_MS - 0.5) return;                  // too early: wait for a later refresh (0.5 ms of slack for timer jitter)
          cap.last = now - (since % GAME_FRAME_MS);               // keep the average at exactly 59.94 instead of drifting
          if (since > GAME_FRAME_MS * 4) cap.last = now;          // after a stall, don't try to catch up
        }

        frameDt = now - lastTime;
        perf.frame(frameDt);
        accumulator += frameDt;
        lastTime = now;
        if (accumulator > FRAME_MS * MAX_STEPS_PER_RENDER) {
          accumulator = FRAME_MS * MAX_STEPS_PER_RENDER;
        }

        let netWait = false;
        if (net.holding(now)) { accumulator = 0; netWait = true; statusEl.innerText = net.holdText(now); }
        else if (net.state.race && statusEl.innerText.startsWith('Race starts')) statusEl.innerText = 'Running!';

        // Watching the ghost: the camera follows it and your own kart stands still (no input) and is hidden
        const watching = !!(ghostRig && CAMERA_VIEWS[camState.view].ghost);
        const followNode = watching ? ghostRig.group : kartMesh;
        const input = watching ? { buttons: 0, stickX: 0, stickY: 0, trick: 0 } : pollInputs();
        kartMesh.visible = !watching;
        if (ghostPaused) accumulator = 0;
        const tPhys = performance.now(); let steps = 0;
        while (!ghostPaused && accumulator >= FRAME_MS) {
          prevPos.copy(currPos);
          prevQuat.copy(currQuat);
          Module._kinoko_set_input(input.buttons, input.stickX, input.stickY, input.trick);
          if (VS.on) {
            Module._kinoko_get_race_state(racePtr);
            VS.sinceStart = Module.HEAP32[racePtr / 4] >= 2 ? VS.sinceStart + 1 : -1;
            VS.drive();
          }
          Module._kinoko_step();
          readKartState();
          readSoundState(input);
          readWheels();
          simFrames++; steps++;
          if (VS.on) VS.capture(simFrames);
          if (net.active()) {
            const m = motionPtr / 4, tm = timingPtr / 4, H = Module.HEAP32, F = Module.HEAPF32;
            net.sendPose(simFrames, { pos: [currPos.x, currPos.y, currPos.z], quat: [currQuat.x, currQuat.y, currQuat.z, currQuat.w],
              flags: lastFlags, speed: F[m], hop: F[m + 4], stick: input.stickX, stage: H[tm + 2], timeMs: H[tm], spin: tireSpin, finalMs: H[tm + 6],
              wheels: currWheels.map((w, i) => [w.x, w.y, w.z, wheelRadii[i] || 0]) });
          }
          accumulator -= FRAME_MS;
        }
        perf.phys = performance.now() - tPhys; perf.steps = steps;
        const tFx = performance.now();

        // 1. Kart Transform, interpolated between the last two physics states
        const alpha = accumulator / FRAME_MS;
        kartMesh.position.lerpVectors(prevPos, currPos, alpha);
        kartMesh.quaternion.copy(prevQuat).slerp(currQuat, alpha);
        placeTires(alpha);
        updateKartShadow();
        if (kartShadow && watching) kartShadow.mesh.visible = false;
        {
          // The game's own kart effects (drift sparks, boost flames, dust, ...), see kartfx.js
          if (!kartEffects) {
            kartEffects = new KartEffects(fxLib, {
              get kart() { return kartMesh; }, tires: () => tireMeshes, radius: () => wheelRadii[2] || wheelRadii[0] || tireRadius,
              groundY: () => (tireMeshes[0] ? tireMeshes[0].position.y : 0) - (wheelRadii[0] || tireRadius), probe: new SurfaceProbe(trackMeshes) });
            window.kartEffects = kartEffects;
          }
          kartMesh.updateMatrixWorld(true);
          const nf = Module._kinoko_get_floor(floorPtr), fl = [];
          for (let i = 0; i < nf; i++) fl.push({ type: Module.HEAP32[floorPtr / 4 + 2 * i], variant: Module.HEAP32[floorPtr / 4 + 2 * i + 1] });
          window.lastFloor = fl;
          kartEffects.update({ floor: fl, flags: lastFlags, driftState: sound.motion.driftState, speedRatio: Math.abs(sound.motion.speedRatio), speed: sound.motion.speed, pos: kartMesh.position });
        }
        if (ambient) ambient.update(fxLib, kartMesh.position);
        fxLib.update(frameDt / 1000);
        if (window.fxCourse) window.fxCourse.update(frameDt / 1000);
        if (window.fxExtra) for (const fx of window.fxExtra) {
          if (fx.onFrame && fx.data) { fx.pend = (fx.pend || 0) + frameDt / FRAME_MS; while (fx.pend >= 1) { fx.pend -= 1; fx.onFrame.forEach(f => f()); } }
          fx.update(frameDt / 1000);
        }
        if (fxAmbience) {
          if (!ambiencePlaying && fxAmbience.data) { fxAmbience.play(ambienceCfg.name, null, { view: true }); ambiencePlaying = true; }
          fxAmbience.update(frameDt / 1000);
        }
        if (ghostRig) ghostRig.render(simFrames, alpha, ghostPaused ? 0 : frameDt / 1000);
        if (ghostRig2) ghostRig2.render(simFrames, alpha, ghostPaused ? 0 : frameDt / 1000);
        net.render(simFrames, alpha, frameDt / 1000);
        if (VS.on) VS.render(simFrames, alpha, frameDt / 1000);
        if (driverAnimator) {
          const steerAngle = -driverAnimator.steer * MAX_WHEEL_STEER;
          if (kartParts.handle) kartParts.handle.rotation.y = steerAngle;
          tireMeshes.forEach(t => { t.rotation.y = t.position.z > 0 ? steerAngle : 0; });
          kartMesh.updateMatrixWorld(true);
          driverAnimator.update(frameDt / 1000);
        }

        const px = kartMesh.position.x;
        const py = kartMesh.position.y;
        const pz = kartMesh.position.z;

        sound.render();
        {
          // the minimap's racer icons: the ghost, the online players and (on top, with its searchlight) the player
          const R = [], fw = new THREE.Vector3();
          const add = (node, character, light) => { fw.set(0, 0, 1).applyQuaternion(node.quaternion); R.push({ x: node.position.x, z: node.position.z, fx: fw.x, fz: fw.z, character, light }); };
          if (ghostRig && activeGhost) add(ghostRig.group, activeGhost.info.character, false);
          if (ghostRig2 && activeGhost2) add(ghostRig2.group, activeGhost2.info.character, false);
          net.state.players.forEach(pl => { if (pl.rig && pl.rig.group.visible) add(pl.rig.group, pl.char, false); });
          VS.racers.forEach(r => { if (r.rig.group.visible) add(r.rig.group, r.character, false); });
          add(kartMesh, selectedCharObj.id, true);
          gameHud.setRacers(R);
        }
        gameHud.draw();

        perf.fx = performance.now() - tFx;
        const tObj = performance.now();
        // 2. Objects Kinoko simulates (see TrackObjects)
        const objCount = Module._kinoko_get_objects(objBufPtr, MAX_OBJS);
        trackObjects.update(objBufPtr, objCount, alpha);
        trackObjects.tick(frameDt / 1000);
        trackObjects.faceCamera(camera);
        updateTexAnims(simFrames + alpha);
        updatePatAnims(Math.floor(simFrames));

        // 3. Camera: a test view, or the wheelie-safe chase camera
        if (!window._freeCam && !chaseLike()) {
          placeTestCamera(kartMesh);
        } else if (!window._freeCam && (watching ? ghostRig.rec.cam : gameCam.curr)) {
          // the game's camera (the ghost's own when watching it), interpolated between physics steps like the kart
          let L;
          if (watching) { const c = ghostRig.camera(simFrames, alpha); L = i => c[i]; }
          else { const a = gameCam.prev, b = gameCam.curr; L = i => a[i] + (b[i] - a[i]) * alpha; }
          camera.up.set(0, 1, 0);
          let ex = L(0), ey = L(1), ez = L(2), tx = L(3), ty = L(4), tz = L(5);
          if (isDown('Look Back')) {
            // The game's look-back: the camera swings to the opposite side of the kart, same height and distance,
            // so you can see what's behind you while still driving normally. Reflecting the eye and look-at point
            // through the kart's position in the horizontal plane reproduces that (their heights are unchanged).
            const kx = followNode.position.x, kz = followNode.position.z;
            ex = 2 * kx - ex; ez = 2 * kz - ez;
            tx = 2 * kx - tx; tz = 2 * kz - tz;
          }
          if (!watching && ((window.kartFlags | 0) & SND.CANNON)) {
            // In a cannon the kart's heading is near-vertical and Kinoko's KartCamera (which orbits that heading) swings up over the
            // character. Keep the eye level behind it instead: same distance from the look-at point, elevation limited to a chase angle.
            const dx = ex - tx, dy = ey - ty, dz = ez - tz, len = Math.hypot(dx, dy, dz), hor = Math.hypot(dx, dz);
            if (len > 1 && hor > 1e-3) {
              const el = Math.max(-10, Math.min(20, Math.atan2(dy, hor) * 180 / Math.PI)) * Math.PI / 180;
              ex = tx + dx / hor * Math.cos(el) * len; ez = tz + dz / hor * Math.cos(el) * len; ey = ty + Math.sin(el) * len;
            }
          }
          // Falling into Bowser's Castle's lava: the camera stays where it was and watches the kart sink instead of following it under the lava
          // (until the respawn carries the kart far away)
          const lf = window.lavaFall;
          if (lf && !watching && lf.pos.distanceToSquared(kartMesh.position) < 3000 * 3000) {
            ex = lf.eye.x; ey = lf.eye.y; ez = lf.eye.z; tx = lf.pos.x; ty = lf.pos.y + 100; tz = lf.pos.z;   // neither the eye nor the view follows the kart down
            if (kartMesh.position.y < lf.pos.y - 300 || (trackObjects.raceFrame || 0) - lf.f > 20) kartMesh.visible = false;                              // it has sunk into the lava
          }
          camera.position.set(ex, ey, ez);
          camera.lookAt(tx, ty, tz);
          const fov = L(6);
          if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
        } else if (!window._freeCam) {
          camera.up.set(0, 1, 0);
          const euler = new THREE.Euler().setFromQuaternion(followNode.quaternion, 'YXZ');
          const yawQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

          const offset = new THREE.Vector3(0, 250, -600).applyQuaternion(yawQuat);
          const targetCamPos = followNode.position.clone().add(offset);

          // Same follow strength as a 0.2 lerp at 60 fps, regardless of display rate
          const camT = 1 - Math.pow(0.8, frameDt / FRAME_MS);
          camera.position.lerp(targetCamPos, camT);
          camera.lookAt(followNode.position.clone().add(new THREE.Vector3(0, 120, 0)));
        }

        if (window.camOverride) { camera.position.fromArray(window.camOverride.pos); camera.lookAt(...window.camOverride.look); }
        trackObjects.faceBoos();
        if (skyModel) {
          skyModel.position.copy(camera.position);
          // Keep the dome's bottom rim comfortably below the camera (see load comment above) by
          // biasing Y down by its own minY plus a safety margin, instead of just matching the camera.
          // (only for domes whose rim sits above their origin: Moonview Highway's dome extends below it, so it needs no push)
          skyModel.position.y -= Math.max(0, skyModel.userData.minY) + 2000;
        }
        LM_KART.value.copy(followNode.position);   // light-mask glow follows the kart (or the ghost being watched)

        ghostMarker1.visible = markersOn && !!ghostRig;
        if (ghostRig) ghostMarker1.position.copy(ghostRig.group.position);
        ghostMarker2.visible = markersOn && !!ghostRig2;
        if (ghostRig2) ghostMarker2.position.copy(ghostRig2.group.position);

        // Project the name tags from this frame's freshly-set camera position/orientation --
        // matrixWorldInverse otherwise wouldn't refresh until the renderer's own update pass.
        camera.updateMatrixWorld();
        updateNameTag(nameTag1, ghostRig, activeGhost);
        updateNameTag(nameTag2, ghostRig2, activeGhost2);

        // Watching the ghost hides and freezes the player kart (see the `watching` comment above),
        // so "Pos" showing the player's position there was always a stale, meaningless number --
        // it's not either ghost, it's the kart nobody's driving. Track both loaded ghosts instead
        // in that mode; otherwise keep the original player+first-ghost readout.
        const fmtVec = v => `x=${v.x.toFixed(1)}, y=${v.y.toFixed(1)}, z=${v.z.toFixed(1)}`;
        let posText;
        if (watching) {
          const parts = [];
          if (ghostRig) parts.push(`Ghost 1: [${fmtVec(ghostRig.group.position)}] rot: [${fmtRot(ghostRig.group.quaternion)}]`);
          if (ghostRig2) parts.push(`Ghost 2: [${fmtVec(ghostRig2.group.position)}] rot: [${fmtRot(ghostRig2.group.quaternion)}]`);
          posText = parts.join(' | ') + ` | Objs: ${objCount}`;
        } else {
          posText = `Pos: [${fmtVec({ x: px, y: py, z: pz })}] rot: [${fmtRot(kartMesh.quaternion)}] | Objs: ${objCount}`;
          if (ghostRig) posText += ` | Ghost: [${fmtVec(ghostRig.group.position)}] rot: [${fmtRot(ghostRig.group.quaternion)}]`;
        }
        posEl.innerText = posText;
        updateGhostFrameUI();

        perf.objs = performance.now() - tObj;
        const gl = renderer.getContext(), tRender = performance.now();
        perf.beginGpu(gl);
        if (bloomFx && bloomOn) bloomFx.render(scene, camera, simFrames + accumulator / FRAME_MS); else renderer.render(scene, camera);
        perf.endGpu(gl);
        perf.render = performance.now() - tRender;
        perf.draw(renderer.info, `physics frame ${simFrames}   particles ${(fxLib.effects || []).reduce((a, e) => a + e.allManagers.reduce((b, m) => b + m.particles.length, 0), 0)}   objects ${objCount}`);
      }

      if (VS.on) { statusEl.innerText = 'Loading CPU racers...'; await VS.setup(Module); statusEl.innerText = 'Running!'; }
      net.raceReady();
      window.__loop = loop;   // debug: lets a test drive frames by hand when the browser pane is hidden and rAF is paused
      loop();
    }).catch(err => {
      statusEl.innerText = "Error: " + err.message;
      console.error(err);
    });

    const setUi = () => document.documentElement.style.setProperty('--ui', Math.min(window.innerHeight / 456, window.innerWidth / 832));
    setUi();
    window.addEventListener('resize', () => { setUi();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
