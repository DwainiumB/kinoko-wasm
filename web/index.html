      Promise.all([fxFalls.ready, fxCruiser.ready, fetch(`assets/tracks/${selectedTrackObj.folder}/objects.json`).then(r => r.json())]).then(([, , objs]) => {
        const FALL = { 715: ['rk_fallbasinA', 'rk_fallbasinC'], 716: ['rk_fallbasinB'] }, d = Math.PI / 180;
        const matrixOf = p => new THREE.Matrix4().compose(new THREE.Vector3(...p.pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(p.rot[0] * d, p.rot[1] * d, p.rot[2] * d, 'ZYX')), new THREE.Vector3(p.scale[0] || 1, p.scale[1] || 1, p.scale[2] || 1));
        for (const p of objs.placements) {
          const m = matrixOf(p);
          if (FALL[p.id]) FALL[p.id].forEach(n => fxFalls.play(n, () => m));
          if (p.id === 236) ['rk_cruiser', 'rk_cruiserSail'].forEach(n => fxCruiser.play(n, () => m));
        }
      });
    }
    // Bowser's Castle: the fireball's trail (koopaBall) and the Thwomps' landing dust (dossun)
    if (selectedTrackObj.folder === 'old_koopa_gba') {   // GBA Bowser Castle 3: the Thwomps' landing dust and the lava splash use the course's own effects
      window.fxDossun = new EffectSystem(scene, camera, 'assets/tracks/old_koopa_gba/effects/dossun');
      (window.fxExtra = window.fxExtra || []).push(window.fxDossun);
      scene.background = new THREE.Color(0xb4501a);   // the lava reaches past the edge of its mesh to the horizon wall: what shows in the gap is the lava's colour, not sky blue
    }
    if (selectedTrackObj.folder === 'koopa_course') {
      window.fxBall = new EffectSystem(scene, camera, `assets/tracks/koopa_course/effects/koopaBall`);
      window.fxDossun = new EffectSystem(scene, camera, `assets/tracks/koopa_course/effects/dossun`);
      (window.fxExtra = window.fxExtra || []).push(window.fxBall, window.fxDossun);
    }
    // Every course's splash (the 'pocha' object, or 'pochaYogan' for lava: a model plus an effect) is what a kart falling into the water / lava makes -- never scenery. Its
    // effect file is loaded here and played by lavaSplash() when the kart respawns.
    fetch(`assets/tracks/${selectedTrackObj.folder}/objects.json`).then(r => r.json()).then(o => {
      const names = Object.values(o.flow).map(f => f.name), dir = names.includes('pochaYogan') ? 'pochaYogan' : names.includes('pocha') ? 'pocha' : null;
      if (!dir) return;
      window.splashKind = dir;
      window.fxPocha = new EffectSystem(scene, camera, `assets/tracks/${selectedTrackObj.folder}/effects/${dir}`);
      (window.fxExtra = window.fxExtra || []).push(window.fxPocha);
    }).catch(() => {});
    if (selectedTrackObj.folder === 'old_sherbet_64') {
      window.fxPenguin = new EffectSystem(scene, camera, 'assets/tracks/old_sherbet_64/effects/penguin_s');
      (window.fxExtra = window.fxExtra || []).push(window.fxPenguin);
    }
    if (selectedTrackObj.folder === 'old_heyho_gba') {
      window.fxHeyho = new EffectSystem(scene, camera, 'assets/tracks/old_heyho_gba/effects/HeyhoBallGBA');
      (window.fxExtra = window.fxExtra || []).push(window.fxHeyho);
    }
    // Screen-wide ambience of a course (its EnvFire object): the game's own effect, drawn around the camera all race long
    const COURSE_AMBIENCE = { volcano_course: { dir: 'EnvFire', name: 'rk_EnvFire' } };   // Bowser's Castle's embers (rk_EnvFire) are left out until they match the game
    const ambienceCfg = COURSE_AMBIENCE[selectedTrackObj.folder];
    const fxAmbience = ambienceCfg ? new EffectSystem(scene, camera, `assets/tracks/${selectedTrackObj.folder}/effects/${ambienceCfg.dir}`) : null;
    let ambiencePlaying = false;
    const fxLib = new EffectSystem(scene, camera);
    window.fxLib = fxLib;

    // --- Environment effects of areas (KMP AREA type 1): the game's own screen effects, played while the kart is inside ---
    // Mushroom Gorge's cave: rk_housi2D (glowing spores) and rk_moyaW2D (drifting haze), both drawn relative to the camera
    const ENV_EFFECTS = { kinoko_course: ['rk_housi2D', 'rk_moyaW2D'] };
    class EnvAreas {
      constructor(names) { this.names = names; this.areas = []; this.playing = null; this.e = new THREE.Euler(0, 0, 0, 'ZYX'); this.q = new THREE.Quaternion(); this.v = new THREE.Vector3(); }
      setAreas(list) { this.areas = list; }
      inside(pos) {
        const d = Math.PI / 180;
        return this.areas.some(a => {
          this.q.setFromEuler(this.e.set(a.rot[0] * d, a.rot[1] * d, a.rot[2] * d)).invert();
          this.v.set(pos.x - a.pos[0], pos.y - a.pos[1], pos.z - a.pos[2]).applyQuaternion(this.q);
          return Math.abs(this.v.x) <= 5000 * a.scale[0] && Math.abs(this.v.z) <= 5000 * a.scale[2] &&
                 this.v.y >= -2000 && this.v.y <= 10000 * a.scale[1];
        });
      }
      update(lib, pos) {
        const on = this.inside(pos);
        if (on && !this.playing && lib.data) this.playing = this.names.map(n => lib.play(n, null, { view: true }));
        else if (!on && this.playing) { this.playing.forEach(e => e && e.stop()); this.playing = null; }
      }
    }
    const envNames = ENV_EFFECTS[selectedTrackObj.folder];
    const ambient = envNames ? new EnvAreas(envNames) : null;

    // r128's GLTFLoader clones a material per vertex-colour/skinning/flat-shading combination it's used with
    // (see its getDependency('material', ...) -> material.clone()), and for a material that also carries a
    // custom-effect extras key (DK Summit's zipper, which is both vertex-coloured AND a TEV effect) that
    // clone comes back missing 'custom' -- 'srt'/'mips' survive but 'custom' silently doesn't, even in
    // gltf.parser.json itself, so something in GLTFLoader's own material pipeline is dropping it, not just
    // the copy onto the Object3D. Rather than chase that further, read the material extras straight from
    // the raw GLB ourselves (the same bytes GLTFLoader fetches) and merge them back in by material name so
    // toUnlit() always sees the full extras regardless of what GLTFLoader's internal cloning did to them.
    async function readGlbExtras(url) {
      try {
        const buf = await (await fetch(url, { cache: 'no-store' })).arrayBuffer();
        const dv = new DataView(buf);
        if (dv.getUint32(0, true) !== 0x46546c67) return {};   // not a GLB (e.g. the Blender course.glb fallback)
        const chunkLen = dv.getUint32(12, true);
        const json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, chunkLen)));
        const out = {};
        for (const m of json.materials || []) if (m.extras) out[m.name] = m.extras;
        return out;
      } catch (e) { return {}; }
    }
    const trackGlbUrl = `assets/tracks/${selectedTrackObj.folder}/track.glb`;
    const extrasByNamePromise = readGlbExtras(trackGlbUrl);
    gltfLoader.load(trackGlbUrl + CACHE_BUST, async (gltf) => {
      const model = gltf.scene;
      const extrasByName = await extrasByNamePromise;
      model.traverse((child) => {
        if (!child.isMesh) return;
        const extras = extrasByName[child.material.name];
        if (extras) Object.assign(child.material.userData, extras);
        child.material = toUnlit(child.material, `assets/tracks/${selectedTrackObj.folder}/pat/`);
        child.frustumCulled = false;
        trackMeshes.push(child);
      });
      scene.add(model);
    }, undefined, () => {
      // Older hand-converted tracks (Blender export, 1/100 scale)
      gltfLoader.load(`assets/tracks/${selectedTrackObj.folder}/course.glb`, (gltf) => {
        const model = gltf.scene;
        model.scale.set(100, 100, 100);
        model.traverse((child) => {
          if (!child.isMesh) return;
          child.material.side = THREE.DoubleSide;
          child.frustumCulled = false;
          if (child.material.map) {
            child.material.map.wrapS = child.material.map.wrapT = THREE.RepeatWrapping;
            child.material.transparent = true;
            child.material.alphaTest = 0.5;
          }
          if (child.material.name.includes("MainRoad") && child.geometry && child.geometry.attributes.uv2) {
            child.geometry.attributes.uv = child.geometry.attributes.uv2;
          }
        });
        scene.add(model);
      }, undefined, () => {
        console.warn(`No track model for ${selectedTrackObj.folder} - run tools/export_tracks.py. Driving on the collision mesh.`);
      });
    });

    // Skybox: a dome around the camera, drawn first with no depth writes. Some sky materials (e.g.
    // TR_cloud) are marked xlu by the game and so come back from toUnlit() as transparent -- three.js
    // draws the transparent queue after the opaque one regardless of renderOrder (that only orders
    // within a queue), so by the time these draw, nearby opaque geometry (the kart, the track) has
    // already written its depth. depthTest used to be forced off here on top of that, which made the
    // sky ignore that depth entirely and paint over things that are actually right in front of the
    // camera, like Mario in the non-chase camera views. depthWrite stays off (nothing should need to
    // be depth-occluded by the sky itself), but depthTest needs to stay on so it still gets properly
    // hidden behind whatever's actually closer.
    let skyModel = null;
    gltfLoader.load(`assets/tracks/${selectedTrackObj.folder}/sky.glb${CACHE_BUST}`, (gltf) => {
      skyModel = gltf.scene;
      const bb = new THREE.Box3();
      skyModel.traverse((child) => {
        if (!child.isMesh) return;
        child.material = toUnlit(child.material);
        child.material.depthWrite = false;
        child.renderOrder = -1000;
        child.frustumCulled = false;
        child.geometry.computeBoundingBox();
        bb.union(child.geometry.boundingBox);
      });
      // The sky mesh is a dome, not a full sphere: its lowest vertices sit at some local Y > the
      // model's own origin (never below it). Simply following the camera 1:1 (see below) would leave
      // that bottom rim floating above the camera's eye height everywhere, so any near-horizontal or
      // downward look -- easy on a flat, open track like Daisy Circuit's plaza -- sees straight past the
      // rim into empty black space instead of sky (usually hidden elsewhere by buildings/terrain filling
      // the lower frame, which is why this went unnoticed on other tracks). minY is stashed so the
      // per-frame sync can push the dome down far enough to always keep that rim below the camera.
      skyModel.userData.minY = isFinite(bb.min.y) ? bb.min.y : 0;
      // Moonview Highway's dome reaches ~390,000 units from its origin, beyond the camera's 300,000 far plane, so most of it was clipped away
      // (leaving only a navy slice at the top right of the screen). It follows the camera and is drawn without depth writes, so shrinking it
      // changes nothing but keeps it inside the frustum.
      const skyR = Math.max(...[bb.min, bb.max].flatMap(v => [Math.hypot(bb.min.x, bb.min.y, bb.min.z), Math.hypot(bb.max.x, bb.max.y, bb.max.z), Math.hypot(v.x, v.y, v.z)]));
      if (skyR > 250000) { const k = 250000 / skyR; skyModel.scale.setScalar(k); skyModel.userData.minY *= k; }
      scene.add(skyModel);
    }, undefined, () => {});

    const kartMesh = new THREE.Group();
    scene.add(kartMesh);

    // Toggleable position markers: a tall, always-on-top beam at each loaded ghost's exact
    // position, so who's actually further along the track is unambiguous from any camera angle --
    // rendering (depth, occlusion, kart rotation) can make raw on-screen placement genuinely hard
    // to judge, especially when the "Watch the ghost" camera only ever follows ghost 1, leaving
    // ghost 2 potentially out of frame or partly hidden behind track geometry. Each beam also
    // carries an XYZ axis gizmo (standard convention: X=red, Y=green, Z=blue) so world-space
    // direction is unambiguous too, not just position -- beam colors are deliberately NOT red/
    // green/blue so they can never be mistaken for an axis.
    const makeGhostMarker = color => {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(4, 4, 500, 8),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, depthTest: false })
      );
      mesh.position.y = 250;
      mesh.renderOrder = 999;
      mesh.visible = false;   // beam hidden -- the axis gizmo alone marks position + orientation
      const axes = new THREE.AxesHelper(300);
      axes.material.depthTest = false;
      axes.material.linewidth = 3;   // most browsers ignore this for GL lines, but harmless
      axes.renderOrder = 1000;
      const group = new THREE.Group();
      group.visible = false;
      group.add(mesh);
      group.add(axes);
      scene.add(group);
      return group;
    };
    const ghostMarker1 = makeGhostMarker(0xffa500);   // orange beam = Ghost 1
    const ghostMarker2 = makeGhostMarker(0xff00ff);   // magenta beam = Ghost 2

    const fallbackBox = new THREE.Mesh(
      new THREE.BoxGeometry(120, 70, 170),
      new THREE.MeshStandardMaterial({ color: 0xe60012 })
    );
    kartMesh.add(fallbackBox);

    // Kart and driver models from tools/brres_to_glb.py, in game units. kart.glb has one node per
    // part; tires are placed each frame at Kinoko's wheel positions (see placeTires).
    const vehicleFile = VEHICLE_FILES[selectedVehObj.id];
    const kartDir = `assets/karts/${vehicleFile}-${CHARACTER_FILES[selectedCharObj.id]}`;
    const tireMeshes = [];   // one per physics wheel, in Kinoko's tire order
    let tireRadius = 30;

    function prepareModel(model) {
      model.traverse(c => {
        if (!c.isMesh) return;
        c.material.metalness = 0;
        c.material.roughness = 0.8;
        if (c.material.map) c.material.map.anisotropy = 4;
      });
      return model;
    }

    // Ground shadow of the vehicle. The game flattens the vehicle's low-poly 'shadow' hull onto the ground and softens it;
    // here the hull's silhouette seen from above is painted once into a blurred texture that lies on the surface under the kart.
    let kartShadow = null;
    function makeKartShadow(hull) {
      const W = 140, D = 170, PX = 0.5, cw = Math.round(2 * W * PX), ch = Math.round(2 * D * PX);
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      const cx = cv.getContext('2d');
      hull.updateMatrixWorld(true);
      const v = new THREE.Vector3(), root = new THREE.Matrix4().copy(hull.parent ? hull.parent.matrixWorld : new THREE.Matrix4()).invert();
      cx.fillStyle = '#000'; cx.fillRect(0, 0, cw, ch);      // the silhouette is white on black: the material reads it as an alpha map
      cx.filter = 'blur(6px)'; cx.fillStyle = '#fff';
      hull.traverse(m => {
        if (!m.isMesh) return;
        const P = m.geometry.attributes.position, I = m.geometry.index, mtx = new THREE.Matrix4().multiplyMatrices(root, m.matrixWorld);
        const pt = i => { v.fromBufferAttribute(P, i).applyMatrix4(mtx); return [(v.x + W) * PX, (v.z + D) * PX]; };
        for (let t = 0; t < (I ? I.count : P.count); t += 3) {
          const a = pt(I ? I.getX(t) : t), b = pt(I ? I.getX(t + 1) : t + 1), c = pt(I ? I.getX(t + 2) : t + 2);
          cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.lineTo(c[0], c[1]); cx.closePath(); cx.fill();
        }
      });
      const tex = new THREE.CanvasTexture(cv); tex.flipY = false;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([-W, 0, -D, W, 0, -D, W, 0, D, -W, 0, D], 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      geo.setIndex([0, 2, 1, 0, 3, 2]);
      const mat = new THREE.MeshBasicMaterial({ alphaMap: tex, color: 0x000000, transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide,
        polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
      const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 2; mesh.frustumCulled = false; mesh.visible = false;
      scene.add(mesh);
      return { mesh, ray: new THREE.Raycaster(), down: new THREE.Vector3(0, -1, 0), o: new THREE.Vector3(), q: new THREE.Quaternion(), qa: new THREE.Quaternion(), e: new THREE.Euler(), n: new THREE.Vector3(), frame: 0, hit: null };
    }
    function updateKartShadow(s = kartShadow, node = kartMesh, strength = 1) {
      if (!s) return;
      if (s.frame++ % 2 === 0) {
        s.ray.set(s.o.copy(node.position).add(s.n.set(0, 120, 0)), s.down); s.ray.far = 4000;
        const h = s.ray.intersectObjects(trackMeshes.filter(m => m.visible && !m.material.transparent), false)[0];
        s.hit = h ? { p: h.point.clone(), n: h.face.normal.clone(), d: h.distance - 120 } : null;
      }
      const h = s.hit; s.mesh.visible = !!h; if (!h) return;
      s.e.setFromQuaternion(node.quaternion, 'YXZ');
      s.qa.setFromUnitVectors(s.n.set(0, 1, 0), h.n); s.q.setFromAxisAngle(s.n.set(0, 1, 0), s.e.y);
      s.mesh.quaternion.copy(s.qa).multiply(s.q);
      s.mesh.position.copy(h.p).addScaledVector(h.n, 2);
      s.mesh.material.opacity = 0.5 * strength * Math.max(0, Math.min(1, 1 - h.d / 1200));
    }

    const loadGltf = url => new Promise((res, rej) => gltfLoader.load(url + CACHE_BUST, res, undefined, rej));
    let driverAnimator = null;
    let kartParts = {};

    Promise.all([
      loadGltf(`${kartDir}/kart.glb`),
      loadGltf(`${kartDir}/driver.glb`),
      fetch('assets/karts/karts.json').then(r => r.json()).catch(() => ({})),
    ]).then(([kartGltf, driverGltf, manifest]) => {
      const kart = prepareModel(kartGltf.scene);
      const driver = prepareModel(driverGltf.scene);
      driver.traverse(c => { if (c.isSkinnedMesh) c.frustumCulled = false; });

      const parts = kartParts;
      kart.children.forEach(c => { parts[c.name] = c; });
      if (parts.shadow) kartShadow = makeKartShadow(parts.shadow);
      const isBike = vehicleFile.endsWith('_bike');
      const tireModels = isBike ? [parts.tire_f, parts.tire_r] : [parts.tire_fl, parts.tire_fr];
      if (tireModels[0]) tireRadius = new THREE.Box3().setFromObject(tireModels[0]).getSize(new THREE.Vector3()).y / 2;

      const info = manifest[vehicleFile] || {};

      // Bike handlebars pivot at a fixed point, tilted back by the fork's rake angle
      if (isBike && parts.handle && info.handle) {
        parts.handle.position.fromArray(info.handle.position);
        parts.handle.rotation.x = THREE.MathUtils.degToRad(info.handle.rake);
      }

      // Suspension arms, swingarms and fork tubes follow animations the page doesn't reproduce yet.
      const placed = new Set(['body', 'handle', ...(isBike ? ['tire_f', 'tire_r'] : ['tire_fl', 'tire_fr'])]);
      kart.children.forEach(c => { if (!placed.has(c.name)) c.visible = false; });
      tireModels.forEach(t => t && kart.remove(t));

      // Karts: wheels 0/2 and 1/3 are the two sides; the page picks left/right by position.
      const wheelCount = isBike ? 2 : 4;
      for (let i = 0; i < wheelCount; i++) {
        const holder = new THREE.Group();
        holder.userData.spin = new THREE.Group();
        holder.add(holder.userData.spin);
        kartMesh.add(holder);
        tireMeshes.push(holder);
      }
      tireMeshes.models = tireModels;

      kartMesh.remove(fallbackBox);
      kartMesh.add(kart);
      kartMesh.add(driver);

      driverAnimator = new DriverAnimator(driver, driverGltf.animations, driverGltf.scene.userData, isBike);
      driverAnimator.kartSpace = kartMesh;
      driverAnimator.handle = isBike ? parts.handle : null;
    }).catch(err => console.warn(`No kart model in ${kartDir} - run tools/brres_to_glb.py`, err));

    // --- Track objects (trees, signs, Goombas, pipes, ...) ---
    // Data from tools/export_objects.py: objects.json (model per object id, from the game's ObjFlow.bin,
    // plus every object the course places) and obj/<resource>.glb. Two sources of positions:
    //  - Objects Kinoko simulates (anything with collision) are drawn live from the physics every frame,
    //    so anything that moves (cars, thwomps, rotating platforms) moves.
    //  - Everything else (mostly scenery) is placed once from the course file.
    // A static copy is hidden as soon as Kinoko turns out to simulate that kind of object.
    const OBJ_DIR = `assets/tracks/${selectedTrackObj.folder}`;
    const HIDDEN_OBJECTS = [/itembox/i, /^pochaYogan$/, /^pocha$/];   // pochaYogan (Bowser's Castle) is the splash when a player falls into the lava, not scenery: see lavaSplash()
    //   // Time Trials have no item boxes; VS mode will turn these on
    const MAX_ANIMATED = 200;   // skeletons animated at once; the rest stay in their bind pose
    const ANIM_PREFERENCE = ['wait', 'move', 'walk', 'walk_l', 'fly', 'flying', 'swim', 'run', 'clapping'];
    const BILLBOARD_OBJECTS = /^(sun|lensFX)$/;   // flat sprites that always face the camera
    const objectsGroup = new THREE.Group();
    scene.add(objectsGroup);

    class TrackObjects {
      constructor() {
        this.data = null;
        this.templates = {};        // resource -> Group with the models to show
        this.byId = new Map();      // object id -> template group or null
        this.flameFx = new Map();   // fire pole holder -> its playing effects
        this.propFx = new Map();   // Epropeller holder -> its playing effect
        this.flameSeen = new Set();
        this.pieces = [];           // volcano pieces (shake and fall on a timer)
        this.raceFrame = 0;         // the game's frame timer
        this.billboards = [];       // objects that turn to face the camera every frame
        this.staticById = new Map(); // object id -> InstancedMesh[] (all copies of that kind, drawn in one call each)
        this.dynamic = [];          // every holder (see pools)
        this.carPlacements = new Map();   // object id -> its KMP placements, in order (car paint variants)
        this.pools = new Map();     // object id -> holders, one per simultaneously live object of that id
        this.dynamicIds = new Set();
        this.tmpQ = new THREE.Quaternion();
        this.tmpEuler = new THREE.Euler(0, 0, 0, 'ZYX');   // MKWii applies X, then Y, then Z
        this.mixers = [];           // one per animated object (skeletal animation, see clone())
        this.cannons = [];          // DonkyCannon_wii clones: {obj, pos, triggered} -- see triggerCannon()
      }

      // Skinned models (goombas, cows, windmills...) can't be instanced: each object is its own clone
      // with its own skeleton and animation mixer, playing the model's idle-like clip at a random phase.
      // stateDriven: for objects Kinoko exposes a real state for (see animState() in ObjectBase.hh -- currently
      // just the moles), whose clips are one-shots tied to specific states rather than a generic loop; the mixer
      // is set up with nothing playing, and updateState() (below) drives it from the object's real state each frame.
      clone(tpl, stateDriven) {
        const c = THREE.SkeletonUtils.clone(tpl);
        const clips = tpl.userData.clips;
        if (clips && clips.length && this.mixers.length < MAX_ANIMATED) {
          const mixer = new THREE.AnimationMixer(c);
          c.userData.mixerRef = mixer;
          if (stateDriven) {
            c.userData.mixer = mixer; c.userData.clips = clips; c.userData.lastState = null;
          } else {
            // Most models name a clip exactly after its purpose ("heyho::move"), but some (e.g.
            // TruckWagon's minecarts) redundantly repeat the model name first ("TruckWagon::TruckWagon_run"),
            // which endsWith('::run') never matches -- falling through to clips[0] and picking whatever
            // clip happens to be exported first (here, the "_change" lane-switch swing, played forever
            // as if it were the cart's idle loop). Also try the suffix after the model's own "_" prefix.
            // a model's low-detail twin carries its own (often empty) copy of the clip, e.g. 'InsekiA-low::InsekiA' (0 s): never pick that one
            const usable = clips.filter(a => !/-low::/.test(a.name)), pool = usable.length ? usable : clips;
            // the plaza's cheering Piantas and Nokis (monte_a, mare_a/b) clap
            const clapClip = clips.some(a => /^(monte_a|mare_[ab])::/.test(a.name)) ? clips.find(a => a.name.endsWith('::clapping')) : null;
            const clip = ANIM_PREFERENCE.map(n => pool.find(a => a.name.endsWith('::' + n) || a.name.endsWith('_' + n))).find(Boolean) || pool[0];
            const action = mixer.clipAction(clapClip || clip);
            action.time = Math.random() * (clapClip || clip).duration;
            action.play();
          }
          this.mixers.push(mixer);
        }
        return c;
      }

      // For a state-driven clone (see clone() above): on a real state change, play that state's clip instead of

      // Rainbow Road's debris swarms (InsekiA id 532: the tumbling rocks, InsekiB id 533: the coloured star bits): each is a long tube of pieces laid along the

      // The boos (see where they are set up): lifecycle of CYCLE frames: fade in (45), drift, fade out (45). At the start of each cycle the boo picks a new spot around the

            if (cyc >= s5) sc = 1;
            else if (cyc >= s4) sc = Math.max(1, P - dv * Math.trunc(down / 2) - dv * (cyc - s4));
            else if (cyc >= s3) { const fs = cyc - s3, half = Math.trunc(down / 2); sc = fs > half ? P - dv * (fs - half) : P; }
            else if (cyc >= s1) sc = P;
            else sc = Math.min(P, dv * cyc + 1);
          }
          c.scale.setScalar(sc * (p.scale[0] || 1));
        });
      }

      // Volcano pieces: rest, shake (a small up-down wobble), quake, then fall at 10 units per frame for 900 frames
      // (Kinoko's ObjectVolcanoPiece::calcShakeAndFall, driven by the race timer)
      updatePieces() {
        const t = this.raceFrame || 0;
        for (const p of this.pieces) {
          let dy = 0;
          if (t >= p.quake + 900) dy = -10 * 900;
          else if (t >= p.quake) dy = -10 * (t - p.quake);
          else if (t >= p.rest && t < p.shake) {
            let step = (t - p.rest) % 8 + 1;
            if (step > 4) step = 4 - step;
            dy = 5 * step;
          }
          p.obj.position.y = p.y + dy;
        }
      }

      async load() {
        try { this.data = await (await fetch(`${OBJ_DIR}/objects.json`, { cache: 'no-store' })).json(); if (ambient) ambient.setAreas((this.data.areas || []).filter(a => a.type === 1)); }
        catch (e) { console.warn('No object data for this track - run tools/export_objects.py'); return; }
        // Bowser's Castle: the fire bars' balls (id 421) are drawn with the fire rings' model, and a geyser's pole (id 515: the pole Kinoko spawns
        // from each geyser foot, id 509, which has no ObjFlow entry of its own) is the 'FlamePoleEff' model of the foot's resource.
        const flow = this.data.flow;
        if (flow['421'] && flow['421'].name === 'koopaFirebar') flow['421'].resources = ['WLfirebarGC'];
        if (flow['509'] && !flow['515']) flow['515'] = { name: 'FlamePoleEff', resources: flow['509'].resources };

        const loader = new THREE.GLTFLoader();
        await Promise.all(Object.entries(this.data.models).map(([res, info]) => new Promise(resolve => {
          loader.load(`${OBJ_DIR}/${info.file}${CACHE_BUST}`, gltf => {
            const tpl = this.templates[res] = this.prepare(gltf.scene, info);
            tpl.userData.clips = gltf.animations;
            tpl.userData.skinned = gltf.animations.length > 0;
            resolve();
          }, undefined, () => resolve());
        })));

        const byId = new Map();
        for (const p of this.data.placements) {
          if (!this.template(p.id, p.set0)) continue;
          const key = p.id + '|' + this.variant(p.id, p.set0);
          if (!byId.has(key)) byId.set(key, []);
          byId.get(key).push(p);
        }
        for (const [key, list] of byId) {
          const id = parseInt(key), tpl = this.template(id, list[0].set0);
          const isPiece = this.data.flow[String(id)].name === 'VolcanoPiece';
          // DonkyCannon_wii's single clip is the cannon firing/opening -- a one-shot tied to a kart actually
          // using it (see Kart::eStatus::InCannon), not an ambient idle loop like the other skinned objects
          // here. Treat it like the state-driven moles (clone(tpl, true): mixer created, nothing playing)
          // instead of clone(tpl)'s random-phase loop, and trigger it for real in triggerCannon() below.
          const isCannon = /^(DonkyCannon_wii|tree_cannon)$/.test(this.data.flow[String(id)].name);
          if (tpl.userData.skinned || isPiece || BILLBOARD_OBJECTS.test(this.data.flow[String(id)].name)) {   // few of these
            const billboard = BILLBOARD_OBJECTS.test(this.data.flow[String(id)].name);
            const clones = list.map(p => {
              const c = this.clone(tpl, isCannon);
              // Non-looping pats (see registerPat): a per-placement palette, not a played animation --
              // Heyho's 'body_color' is exactly this (heyho.1/.2/.3, picked by settings[1] for red/green/
              // yellow Shy Guys). SkeletonUtils.clone() shares materials across clones, so give this one
              // its own material before picking its colour, or every instance would repaint together.
              c.traverse(mesh => {
                if (!mesh.isMesh || !mesh.material) return;
                const pat = mesh.material.userData.pat, texs = mesh.material.userData.patTexs;
                if (!pat || !texs) return;
                const idx = Math.min(Math.max((p.settings ? p.settings[1] : 0) | 0, 0), pat.keys.length - 1);
                mesh.material = mesh.material.clone();
                mesh.material.map = texs[pat.keys[idx][1]];
              });
              this.place(c, p.pos[0], p.pos[1], p.pos[2], p.rot[0], p.rot[1], p.rot[2], p.scale[0], p.scale[1], p.scale[2]);
              objectsGroup.add(c);
              if (this.data.flow[String(id)].name === 'FlamePole') c.children.forEach(n => { if (n.name === 'FlamePoleEff') n.visible = false; });   // the pole itself is a live object (id 515)
              if (isPiece) this.pieces.push({ obj: c, y: p.pos[1], rest: p.settings[1] * 60, shake: (p.settings[1] + p.settings[2]) * 60, quake: (p.settings[1] + p.settings[2]) * 60 + p.settings[7] + 1 });
              if (isCannon) this.cannons.push({ obj: c, pos: new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]), triggered: false });
              return c;
            });
            if (billboard) this.billboards.push(...clones);
            // DS Delfino Square's draw bridges (TownBridgeDSc, id 511): Kinoko turns the bridge's collision about its hinge but never reports the object, so the model
            // stood still. Replayed here from ObjectTownBridge::calcBridgeAngle (settings: speed in degrees, pivot / raised / lowered frames; rotates upwards when the yaw is negative).
            if (this.data.flow[String(id)].name === 'TownBridgeDSc') {
              clones.forEach((c, i) => { if (c.userData.mixerRef) c.userData.mixerRef.stopAllAction(); this.bridgeList = (this.bridgeList || []).concat([{ c, p: list[i] }]); });
            }
            // SNES Ghost Valley 2's boos (BGteresaSFC / b_teresa): flat sprites, three look-alike models stacked in one resource. Kinoko doesn't simulate them and the game's
            // behaviour isn't in the files, so (from how the game looks): each boo shows one of the three, flaps with the resource's texture loop, hops with its clip's
            // squash-and-stretch, always faces the camera, and keeps reappearing near the player -- it fades in at a spot around the camera, drifts, fades out, then
            // comes back somewhere else (see updateBoos / faceBoos). The exact spawn pattern is a guess.
            if (/^(BGteresaSFC|b_teresa)$/.test(this.data.flow[String(id)].name)) {
              clones.forEach((c, i) => {
                if (c.userData.mixerRef) { c.userData.mixerRef.stopAllAction(); }
                const v = i % 2; c.userData.boo = { i, nodes: [], cycle: -1, anchor: new THREE.Vector3() };
                c.children.forEach((m, k) => { m.visible = k === v; if (k === v) m.traverse(n => { if (n.name === 'pPlane1' || n.name === 'pPlane1_scale') c.userData.boo.nodes.push(n); }); });
                c.traverse(n => {
                  if (!n.isMesh) return;
                  const orig = n.material, pa = patAnims.find(a => a.m === orig);
                  n.material = orig.clone(); n.material.side = THREE.DoubleSide; n.material.transparent = true; n.material.depthWrite = false;   // own opacity per boo
                  if (pa) patAnims.push({ m: n.material, pat: pa.pat, texs: pa.texs, current: null });
                  (c.userData.boo.mats = c.userData.boo.mats || []).push(n.material);
                });
                c.visible = false; c.renderOrder = 5; this.booList = (this.booList || []).concat([c]);
              });
            }
            if (this.dynamicIds.has(id)) clones.forEach(c => { c.visible = false; });   // Kinoko already draws this kind (the template finished loading after its first update)
            this.staticById.set(id, (this.staticById.get(id) || []).concat(clones));
          } else {
            const insts = this.instance(tpl, list);
            if (this.data.flow[String(id)].name === 'K_bomb_car') insts.forEach(c => { c.visible = false; });   // see above
            if (this.dynamicIds.has(id)) insts.forEach(c => { c.visible = false; });   // same race as above
            if (this.data.flow[String(id)].name === 'ami') this.makeNet(insts, list[0]);
            // (Waluigi Stadium's pipe piranha plants are left out for now: Kinoko has no such object; makePlants() holds a stand-in)
            this.staticById.set(id, (this.staticById.get(id) || []).concat(insts));
          }
        }
      }

      // One InstancedMesh per mesh of the model, with a matrix per placement (a draw call per kind
      // instead of per object: Ghost Valley's 600 blocks were 1,900 draw calls and ran at 2 fps)
      instance(tpl, list) {
        tpl.updateMatrixWorld(true);
        const d = Math.PI / 180, e = new THREE.Euler(0, 0, 0, 'ZYX'), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
        const placeMatrices = list.map(p => new THREE.Matrix4().compose(
          v.set(p.pos[0], p.pos[1], p.pos[2]),
          q.setFromEuler(e.set(p.rot[0] * d, p.rot[1] * d, p.rot[2] * d)),
          sc.set(p.scale[0] || 1, p.scale[1] || 1, p.scale[2] || 1)));
        const out = [];
        tpl.traverse(mesh => {
          if (!mesh.isMesh) return;
          const im = new THREE.InstancedMesh(mesh.geometry, mesh.material, list.length);
          im.renderOrder = mesh.renderOrder;
          let top = mesh; while (top.parent && top.parent !== tpl) top = top.parent;
          im.userData.part = top.name; im.userData.meshMtx = mesh.matrixWorld.clone(); im.userData.list = list;   // for animated static objects (setupStaticAnims)
          placeMatrices.forEach((m, i) => im.setMatrixAt(i, m.clone().multiply(mesh.matrixWorld)));
          im.instanceMatrix.needsUpdate = true;
          im.frustumCulled = false;
          objectsGroup.add(im);
          out.push(im);
        });
        return out;
      }

      // Shows the detailed models of a resource (not low-detail variants) with unlit materials
      prepare(root, info) {
        const group = new THREE.Group();
        for (const node of [...root.children]) {
          if (/(^|[-_])(low|lod|far)([-_]|$)/i.test(node.name) && info.models.length > 1) continue;
          node.traverse(c => {
            if (!c.isMesh) return;
            const faceCard = /MiiFace/i.test(c.material.name);   // the game paints each player's Mii here
            const effOrder = c.material.userData && c.material.userData.custom && c.material.userData.custom.order;
            c.material = toUnlit(c.material, `${OBJ_DIR}/obj/pat/`);
            if (effOrder) c.renderOrder = effOrder;
            if (c.isSkinnedMesh) c.material.skinning = true;   // three r128 only skins materials that ask to
            // Dry Dry Ruins' bats: body, face and nose are single flat quads that vanish from behind with the file's back-face culling -- only
            // the wings (a thick mesh) showed. Drawn from both sides they look right from every angle.
            if (c.material.name === 'mat_basabasa') c.material.side = THREE.DoubleSide;
            if (info.models && info.models.includes('TwistedWay')) this.twistMaterial(c.material);
            if (info.models && info.models.includes('aurora')) this.auroraMaterial(c.material);
            if (faceCard) { c.material.map = null; c.material.color.set(0xe3bf9a); }
            c.frustumCulled = false;
          });
          group.add(node);
        }
        return group;
      }

      // The model group for an object id, or null (no model, or hidden)
      // Mushroom Gorge's mushrooms share one file holding every look; the object kind and its first
      // setting choose one (red = bouncy 'kinoko_ud/bend', green = road 'kinoko_nm'; setting 0 =
      // light or dark variant, as in Kinoko's ObjectKinoko*::getKclName), so the rest are left out
      variant(id, set0) {
        const flow = this.data && this.data.flow[String(id)];
        if (flow && flow.name === 'VolcanoPiece') return 'piece' + set0;   // one of the resource's models, chosen by the first setting
        if (flow && flow.name === 'woodbox') return 'wb' + (this.isVsMode() ? 'w' : 'i');   // DS Delfino Square's crates: unbreakable metal-and-wood in Time Trials, breakable wood in VS / online
        const ob = flow && /^obakeblock(\d)?SFCc$/.exec(flow.name);   // SNES Ghost Valley 2: three block kinds share one resource, one model each
        if (ob) return 'ob' + (ob[1] || '1');
        const m = flow && /^kinoko_(ud|bend|nm)$/.exec(flow.name);
        if (!m) return '';
        return (m[1] === 'nm' ? 'g' : 'r') + (set0 ? '_d' : '');
      }

      // sub: for a resource whose glTF bundles several separately-named objects that are placed and Kinoko-simulated
      // independently (currently just the moles: choropu.glb has both the 'choropu' creature and its 'holl' hole as
      // separate top-level nodes, and Kinoko tracks each as its own object, both stamped with the same map id) --
      // picks out just that one node instead of drawing the whole bundle at each of their positions.
      template(id, set0 = 0, sub) {
        const key = id + '|' + this.variant(id, set0) + (sub ? '#' + sub : '');
        if (this.byId.has(key)) return this.byId.get(key);
        let tpl = null;
        const flow = this.data && this.data.flow[String(id)];
        if (flow && !HIDDEN_OBJECTS.some(rx => rx.test(flow.name))) {
          const res = flow.resources.find(r => this.templates[r]);
          if (res) tpl = this.templates[res];
          const v = this.variant(id, set0);
          if (tpl && v.startsWith('wb')) {
            const g = new THREE.Group(), want = v === 'wbw' ? 'woodbox' : 'ironbox';
            tpl.children.filter(c => c.name === want).forEach(c => g.add(c.clone()));
            g.userData = tpl.userData;
            tpl = g;
          } else if (tpl && v.startsWith('ob')) {
            const g = new THREE.Group(), want = v === 'ob1' ? 'obakeblockSFC' : 'obakeblock' + v.slice(2) + 'SFC';
            tpl.children.filter(c => c.name === want).forEach(c => g.add(c.clone()));
            g.userData = tpl.userData;
            tpl = g;
          } else if (tpl && v.startsWith('piece')) {
            const g = new THREE.Group();
            tpl.children.filter(c => c.name === 'VolcanoPiece' + v.slice(5)).forEach(c => g.add(c.clone()));
            g.userData = tpl.userData;
            tpl = g;
          } else if (tpl && v) {
            const dark = v.endsWith('_d'), color = v[0];
            const want = dark ? [`kinoko_d_${color}`, 'kinoko_d_kuki'] : [`kinoko_${color}`, 'kinoko_kuki'];
            const g = new THREE.Group();
            tpl.children.filter(c => want.includes(c.name)).forEach(c => g.add(c.clone()));
            g.userData = tpl.userData;
            tpl = g;
          }
          if (tpl && sub) {
            const g = new THREE.Group();
            // SkeletonUtils.clone() (used later in clone()) rebuilds a SkinnedMesh's bone bindings by matching
            // against bones that are descendants of what it's cloning; a plain c.clone() here would leave the
            // skeleton pointing at the original unfiltered template's bones, producing a mesh that skins to a
            // degenerate/invisible pose. Cloning through SkeletonUtils here keeps the bone hierarchy self-contained.
            const subNames = sub.split('+');   // 'a+b+c': several of the resource's models at once
            tpl.children.filter(c => subNames.includes(c.name)).forEach(c => g.add(THREE.SkeletonUtils.clone(c)));
            g.userData = tpl.userData;
            // the models of one resource share bone names ('skl_root', 'leg_L'...), so each needs only its own clips
            if (/^(hanachan|sanbo)/.test(sub)) g.userData = Object.assign({}, tpl.userData, { clips: (tpl.userData.clips || []).filter(a => a.name.startsWith(sub + '::')) });
            tpl = g;
          }
        }
        this.byId.set(key, tpl);
        return tpl;
      }

      isVsMode() {
        try { const o = JSON.parse(sessionStorage.getItem('mkw_online') || 'null'); if (o && o.start) return true; } catch (e) {}
        const ms = document.getElementById('modeSelect'); return !!ms && ms.value === '1';
      }

      // set0 of a Kinoko-simulated object: that of the nearest placement of the same id
      set0Near(id, x, z) {
        let best = null, bd = 1e30;
        for (const p of this.data.placements) {
          if (p.id !== id) continue;
          const d = (p.pos[0] - x) ** 2 + (p.pos[2] - z) ** 2;
          if (d < bd) { bd = d; best = p; }
        }
        return best ? best.set0 : 0;
      }

      // The fire pole's particle effects play while the pole is up: the column's flames follow the pole, and the splash
      // ring stays on the lava surface at its foot (the pole sinks 384 units per unit of scale when dormant)
      flameEffects(holder, id, x, y, z, scale) {
        if (!window.fxCourse || !window.fxCourse.data) return;
        const lava = this.initialY(id, x, z);
        if (Math.abs(y - lava) > 1) this.flameSeen.add(holder);   // the pole waits at its placed height until the game first moves it
        const active = this.flameSeen.has(holder) && y > lava - 384 * scale + 1;
        const cur = this.flameFx.get(holder);
        if (active && !cur) {
          const at = (yy) => () => new THREE.Matrix4().makeTranslation(x, yy(), z).scale(new THREE.Vector3(scale, scale, scale));
          this.flameFx.set(holder, ['rk_flamePole', 'rk_flamePoleFoot'].map((n, i) => window.fxCourse.play(n, at(i === 0 ? () => holder.position.y : () => lava))).filter(Boolean));
        } else if (!active && cur) { cur.forEach(e => e.stop()); this.flameFx.delete(holder); }
      }

      // Press: a one-shot dust puff (rk_pressSmoke) the instant the stomper slams into the floor.
      // ObjectPress has no animState() override (it's not in the small list Kinoko exposes a real
      // state for), so there's no flag to key off -- the impact is detected the same way the game's
      // own effect trigger would see it: the object's downward motion (ACCEL-driven, so several
      // units/frame well before touchdown) coming to a dead stop in a single frame.
      pressEffects(holder, x, y, z) {
        if (!window.fxCourse || !window.fxCourse.data) return;
        const u = holder.userData;
        const falling = u.pressLastY !== undefined && y < u.pressLastY - 0.5;
        if (u.pressFalling && !falling) {
          window.fxCourse.play('rk_pressSmoke', () => new THREE.Matrix4().makeTranslation(x, y, z));
        }
        u.pressFalling = falling;
        u.pressLastY = y;
      }

      // Koopa Cape's electric propellers (Epropeller): rk_epropeller is the parent effect, it spawns the green lightning
      // (rk_epropellerThunder, a line emitter along the arms) and the hub spark (rk_epropellerSpark0). It plays for
      // the whole race, riding the spinning object's own transform.
      propellerEffects(holder) {
        if (!window.fxCourse || !window.fxCourse.data || this.propFx.has(holder)) return;
        // one per blade: the game's blades sit 120 degrees apart about the object's own Z axis (see ObjectPropeller::calcCollisionTransform)
        this.propFx.set(holder, [0, 1, 2].map(k => window.fxCourse.play('rk_epropeller', () => {
          holder.updateWorldMatrix(true, false);
          return holder.matrixWorld.clone().multiply(new THREE.Matrix4().makeRotationZ(k * 2 * Math.PI / 3));
        })));
      }

      // Maple Treeway's net bridge (ami): the model has no animation of its own -- the game bounces it with the same travelling wave that
      // Kinoko's ObjectAmi uses for its collision: height offset = 550 * sin(pi * z' / 13800) * sin(pi * t / 35) - 910 * (2 * pi * z' / 13800) (the slope that carries the net down to the ground at its far end; the model itself is flat), where z' is the distance
      // along the net (world -Z from the object's origin) and t the race frame. Applied to the vertices in world space.
      makeNet(insts, placement) {
        const u = this.netUniforms = { uAmiT: { value: 0 }, uAmiPos: { value: new THREE.Vector3(...placement.pos) } };
        for (const im of insts) {
          const mat = im.material;
          mat.onBeforeCompile = (sh) => {
            Object.assign(sh.uniforms, u);
            sh.vertexShader = 'uniform float uAmiT; uniform vec3 uAmiPos;' + String.fromCharCode(10) + sh.vertexShader.replace('#include <project_vertex>', `
              vec4 amiLocal = vec4(transformed, 1.0);
              #ifdef USE_INSTANCING
                amiLocal = instanceMatrix * amiLocal;
              #endif
              vec4 amiWorld = modelMatrix * amiLocal;
              float amiZ = -(amiWorld.z - uAmiPos.z);
              amiZ = clamp(amiZ, 0.0, 13800.0);   // clamp, not skip: the net's end vertices sit exactly on 13800 and must drop with the rest
              amiWorld.y += 550.0 * sin(3.14159265 * amiZ / 13800.0) * sin(3.14159265 * uAmiT / 35.0) - 910.0 * (6.2831853 * amiZ / 13800.0);
              vec4 mvPosition = viewMatrix * amiWorld;
              gl_Position = projectionMatrix * mvPosition;`);
          };
          mat.needsUpdate = true;
        }
      }

      // See the Wiggler note where fxHana is created. Moving = the head travelled more than 2 units since the last frame.
      hanaEffects(holder) {
        const fx = window.fxHana;
        if (!fx || !fx.data) return;
        const u = holder.userData;
        // Speed in units per PHYSICS frame, measured only when the game's frame counter has advanced (a raw per-render-frame distance is
        // zero on every render frame that falls between two physics steps). The walk/wait thresholds are a wide band around the ~35 units
        // per frame they really walk at, so the small sway of a standing Wiggler never counts as walking.
        const f = this.raceFrame || 0;
        if (u.hanaF === undefined || f < u.hanaF) { u.hanaF = f; u.hanaPrev = holder.position.clone(); u.hanaSpeed = 0; }
        else if (f !== u.hanaF) {
          const inst = u.hanaPrev.distanceTo(holder.position) / (f - u.hanaF);
          u.hanaSpeed = u.hanaSpeed * 0.5 + inst * 0.5; u.hanaF = f; u.hanaPrev.copy(holder.position);
        }
        const moving = u.hanaMoving ? u.hanaSpeed > 6 : u.hanaSpeed > 12;
        u.hanaMoving = moving;
        const mat = () => { holder.updateWorldMatrix(true, false); return holder.matrixWorld.clone(); };
        const live = u.hanaFx || (u.hanaFx = {});
        const want = {};   // rk_hanaBlow (nostril breath) removed: it rendered as large bright flares around the Wigglers' route and is probably an angry-only effect
        for (const n in want) {
          if (want[n] && !live[n]) live[n] = fx.play(n, mat);
          else if (!want[n] && live[n]) { live[n].stop(); live[n] = null; }
        }
        if (moving && (u.hanaTick = (u.hanaTick || 0) + 1) % 20 === 0) fx.play('rk_hanaSmk', mat);
      }
      // A Pokey (sanbo) resource holds 5 models: 'sanbo' (the skinned 4-joint pokey that walks), 'sanbo_body' / 'sanbo_head' (loose
      // pieces) and the two 'big_sanbo' ones; drawing them all at once piled them on top of each other. Only 'sanbo' is the walking pokey.
      // It plays 'move' while the rail carries it and holds still while it waits at a rail end (speed per physics frame, as for the Wigglers).
      sanboAnim(holder, c) {
        const u = holder.userData, m = c.userData.mixer, clips = c.userData.clips;
        if (!m || !clips) return;
        const f = this.raceFrame || 0;
        if (u.spdF === undefined || f < u.spdF) { u.spdF = f; u.spdPrev = holder.position.clone(); u.spd = 0; }
        else if (f !== u.spdF) { u.spd = u.spd * 0.5 + 0.5 * u.spdPrev.distanceTo(holder.position) / (f - u.spdF); u.spdF = f; u.spdPrev.copy(holder.position); }
        u.sanboMoving = u.sanboMoving ? u.spd > 0.4 : u.spd > 1.2;
        if (!c.userData.sanboAction) {
          const clip = clips.find(a => a.name === 'sanbo::move');
          if (!clip) return;
          const act = m.clipAction(clip); act.play(); c.userData.sanboAction = act;
        }
        c.userData.sanboAction.timeScale = u.sanboMoving ? 1 : 0;
      }

      // Wiggler part animation: walk while the head travels, wait otherwise (head parts use head_walk / head_wait)
      hanaAnim(c, sub, isHead, moving) {
        const u = c.userData, m = u.mixer, clips = u.clips;
        if (!m || !clips) return;
        const name = `${sub}::${isHead ? 'head_' : ''}${moving ? 'walk' : 'wait'}`;
